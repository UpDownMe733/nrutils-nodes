<script type="text/html" data-help-name="claude-agent">
    <p>Runs one Claude Code agent for each start message. The node is one stage of an agent workflow. A wire gives the result to the next stage.</p>
    <p>The agent runs with all permissions: it gets no permission prompt. Run Node-RED or the launcher as a separate OS user, or in a container. See the README.</p>
    <p>A run loads no user settings, skills, outside MCP servers or auto memory, unless you set <b>Project settings</b> or <b>Full environment</b>.</p>

    <h3>Properties</h3>
    <dl class="message-properties">
        <dt>Name</dt><dd>The label of the node. It is also the key in <code>msg.stages</code>.</dd>
        <dt>Summary</dt><dd>A short line that the popup shows under the name. It is not sent to Claude. <b>From system prompt</b> copies the first sentence of the system prompt into the field. Check it before you click Done: the popup shows it to each person who opens the editor. Empty: no line.</dd>
        <dt>Folder</dt><dd>The work folder of the agent. It must be the work root (<code>claudeAgent.workRoot</code> in <code>settings.js</code>, default the home folder of Node-RED) or a folder below it. Empty: the work root. <code>msg.cwd</code> replaces it.</dd>
        <dt>Sandbox</dt><dd>A name that the node gives to the launcher program (<code>claudeAgent.launcher</code>) in the environment variable <code>NODE_RED_CLAUDE_SANDBOX</code>, with the folder in <code>NODE_RED_CLAUDE_CWD</code>. The launcher can then start the CLI in that container or machine. Empty: no sandbox.</dd>
        <dt>System prompt</dt><dd>It is added to the Claude Code system prompt. Empty: no extra instructions.</dd>
        <dt>Model</dt><dd>Empty: the default model. Else haiku, sonnet, opus or fable. <code>msg.model</code> replaces it.</dd>
        <dt>Effort</dt><dd>How much the model thinks: <code>low</code>, <code>medium</code>, <code>high</code>, <code>xhigh</code> or <code>max</code>. Empty: the default of the model.</dd>
        <dt>Cache time</dt><dd>How long the prompt cache of the run lives between two requests: 5 or 60 minutes. Default 60. A 60-minute cache write costs more (2&times; input, against 1.25&times;), but a run that waits for the operator longer than 5 minutes reads the cache again.</dd>
        <dt>Session</dt><dd><code>message</code> (default): each start message runs in a new session. <code>agent</code>: the node is one agent with one session that continues. See <b>Session mode agent</b> below.</dd>
        <dt>Context limit</dt><dd>Agent mode only. Above this number of tokens, the agent writes a note and a new session continues. Default 100000.</dd>
        <dt>Max keep-alive</dt><dd>Agent mode only. The number of keep-alive turns before a close. Default 3.</dd>
        <dt>MQTT broker</dt><dd>Optional. A <code>mqtt-broker</code> config node. It gives the node an inbox and the <code>send</code> tool. See <b>MQTT inbox</b> below.</dd>
        <dt>Prompt</dt><dd>A mustache template over the message, for example <code>{{payload}}</code> or <code>{{stages.triage.problem}}</code>. An object value becomes JSON.</dd>
        <dt>Tools</dt><dd>A comma list of the tools of the agent. Empty: all tools. The agent gets no permission prompt.</dd>
        <dt>Project settings</dt><dd>When set, the run loads <code>CLAUDE.md</code> and <code>.claude/settings.json</code> of the folder. Default off.</dd>
        <dt>Full environment</dt><dd>When set, the run loads the user and project settings, the user <code>CLAUDE.md</code>, the skills and the MCP servers of the OS user that runs the CLI. Auto memory stays off. Default off.</dd>
        <dt>Max turns</dt><dd>Default 30.</dd>
        <dt>Max cost ($)</dt><dd>The cost limit of one run. Default 2. Empty: no limit.</dd>
        <dt>Timeout (min)</dt><dd>The time limit of one run, also while it waits for an answer. Default 30. Empty: no limit.</dd>
        <dt>Max parallel</dt><dd>The number of runs at the same time. More start messages wait in a queue. The agent mode ignores it.</dd>
        <dt>Output schema</dt><dd>Optional JSON schema. When set, the result payload is an object that agrees with the schema.</dd>
        <dt>MCP servers</dt><dd>Optional JSON object: server name to <code>{ command, args, env }</code>. The agent gets these servers and the <code>operator</code> server.</dd>
    </dl>

    <h3>Inputs</h3>
    <p>A start message has no <code>msg.agent.cmd</code>. The rendered prompt is the task.</p>
    <dl class="message-properties">
        <dt class="optional">cwd <span class="property-type">string</span></dt><dd>The work folder for this run.</dd>
        <dt class="optional">model <span class="property-type">string</span></dt><dd><code>haiku</code>, <code>sonnet</code>, <code>opus</code> or <code>fable</code>. This run uses that model in place of the model of the node. The node ignores a different value, also a full model ID.</dd>
        <dt class="optional">agent.resume <span class="property-type">string</span></dt><dd>A session id. The run continues that session. The node ignores <code>msg.agent.sessionId</code> on a start message.</dd>
    </dl>
    <p>A control message has <code>msg.agent = { cmd, runId }</code> and a text <code>msg.payload</code>. You can omit <code>runId</code> when the node has one active run.</p>
    <ul>
        <li><code>answer</code>: the answer to the open question.</li>
        <li><code>message</code>: a new user message for the session.</li>
        <li><code>interrupt</code>: stop the current turn. The run stays open for a <code>message</code>.</li>
        <li><code>stop</code>: end the run. This is not an error. Output 1 sends nothing.</li>
    </ul>

    <h3>Outputs</h3>
    <ol class="node-ports">
        <li>Result
            <dl class="message-properties">
                <dt>payload <span class="property-type">string | object</span></dt><dd>The final text, or the schema object.</dd>
                <dt>stages <span class="property-type">object</span></dt><dd>The payload of each stage. This node adds its payload under its name, else under its node id. Earlier entries stay.</dd>
                <dt>agent <span class="property-type">object</span></dt><dd><code>{ runId, sessionId, model, turns, durationMs, tokens, weighted, usage }</code>. <code>weighted</code> is the price-weighted total in sonnet input tokens (see the README). Put <code>sessionId</code> into <code>msg.agent.resume</code> to continue the session.</dd>
            </dl>
        </li>
        <li>Question
            <dl class="message-properties">
                <dt>payload <span class="property-type">object</span></dt><dd><code>{ question, options }</code> from <code>ask_operator</code>.</dd>
            </dl>
        </li>
        <li>Events
            <dl class="message-properties">
                <dt>payload <span class="property-type">object</span></dt><dd><code>{ runId, seq, time, kind, text }</code>. The node cuts <code>text</code> after 300 characters. A <code>prompt</code> event from the inbox has the message text only (no label line), <code>source: 'agent'</code> and <code>from</code>. The <code>sent</code> event of the <code>send</code> tool has <code>to</code>. One from a keep-alive or close turn has <code>source: 'life'</code>.</dd>
            </dl>
        </li>
    </ol>

    <h3>Details</h3>
    <p>Each run has the tool <code>ask_operator(question, options)</code>. The run waits for an answer from output 2, from a control message, or from the popup.</p>
    <p>A run waits for its background tasks, subagents and shell jobs. It ends with the first result that comes when no background task works.</p>
    <p>A failed run goes to a <code>catch</code> node. <code>msg.agent.reason</code> is one of <code>max_turns</code>, <code>max_cost</code>, <code>timeout</code>, <code>schema</code>, <code>sdk_error</code> or <code>node_closed</code>.</p>
    <p>Right-click the node and choose <b>Open popup</b>, the first item of the menu. A left-click on the node shows its chat in the sidebar panel and does not open the popup. Click × at the top of the popup to close it. The top of the popup shows the name of the node (or claude-agent), its summary (when set) and a line with its model, folder and sandbox. The model is the true model of the selected run, for example <code>opus 5.5</code>. With no run, it is the model of the last run. A model of the node with another family shows after it, for example <code>opus 5.5 (node: sonnet)</code>. The folder and the sandbox are the settings of the node, not the msg.cwd of a run. Drag the empty part of the tab row to move the popup. The two tabs are below it. Chat shows the text of the operator on the right and the text of the agent on the left. Timeline shows all events. The status line shows the state, the turns, the tokens used and the context size of the last model response.</p>
    <p>The <b>Claude agent</b> tab of the sidebar shows the same chat as the popup. Both work at the same time and share the message box. A left-click on a claude-agent node shows its chat in the panel. The panel keeps that chat when you select other nodes.</p>
    <p>The timer chip in the header shows <b>Active</b>, the time since the selected run started, and <b>Cache</b>, the minutes until the prompt cache expires, for example <code>Cache 52m</code>. The cache countdown starts again at each model response. It is an estimate. <code>Cache cold</code> means that the next message reads the full context again at the full price. The chip turns amber at 5 minutes or less.</p>
    <p><b>New chat</b> (the + button) makes the node forget its last session and clears the popup log. The next message from the popup starts a new session. It is not possible while a run is active.</p>
    <p>The message box is at the bottom. Enter sends; Shift+Enter starts a new line. When no run is active, Send starts a run with your text as the task; the run continues the last session of the node. When the agent asks a question, the popup shows it with one button for each option, and Send becomes Answer. Interrupt and Stop show only while a run is active.</p>
    <p>Paste a screenshot or a file (Ctrl+V) into the message box to send it to the agent: a picture, a PDF or a text file. A message takes 5 files and 3 MB at most, a text file 1 MB in UTF-8. The popup makes a large picture smaller.</p>
    <p>A deploy of the node ends its live runs and clears the popup log.</p>

    <h3>Session mode agent</h3>
    <p>The node runs one turn at a time and keeps one session. A message that arrives during a turn waits. At the turn end, all waiting messages go in as one prompt, and each gets one output.</p>
    <p>After a turn, a timer runs: the cache time minus 1 minute. Each model response starts it again. At the timer end, the node closes the session: it asks the agent for a note of 200 words maximum, stores the answer, and forgets the session. An empty answer gives no note. If a <code>send</code> has no answer yet, the node sends a keep-alive turn (prompt <code>.</code>) in place of the close, up to <b>Max keep-alive</b> times.</p>
    <p>A context above <b>Context limit</b> at a turn end also closes the session. In a long turn, the node tells the agent to call the tool <code>handoff(note)</code>. The node then stores the note and continues the task in a new session. The input message gets its output from the new session.</p>
    <p>A new session starts with the note and then deletes it. The note is the file <code>&lt;userDir&gt;/claude-agent/&lt;node id&gt;.note.md</code>. Stop keeps the session, and the timer runs.</p>
    <p>The node keeps the id of the last session in the file <code>&lt;userDir&gt;/claude-agent/&lt;node id&gt;.session</code>. A deploy and a restart do not delete it. A close turn and New chat delete it. A new session with no note, and with this file (the last session had no close turn), starts with a text that tells the agent to read the record of its last session (<code>~/.claude/projects/*/&lt;id&gt;.jsonl</code>). The agent reads it, not the node.</p>
    <p>Keep-alive and close turns send nothing on the outputs. The popup shows them as <i>life cycle</i> lines.</p>

    <h3>Files</h3>
    <p>Each run has the tool <code>publish({ path, name, title, entry, note })</code>. The agent gives a file or a folder to the people with it. <code>path</code> must be in the work root. The same <code>name</code> from the same node makes a new version. A publish of equal content makes no new version.</p>
    <p>The node reads the files with the rights of the agent: <code>tar</code> reads them. With a launcher, <code>claudeAgent.agentExec</code> in <code>settings.js</code> runs <code>tar</code>. A symbolic link, a name outside the folder, and more than <code>claudeAgent.artifacts.maxBytes</code> (100 MB) or <code>maxFiles</code> (2000) stop the publish with an error. Each publish gives an event of the kind <code>artifact</code>. A delete moves a file or a version to the bin. The node removes its files after 30 days. See the README.</p>

    <p>Each publish makes a file. The <b>Files</b> tab of the popup lists the files of the node. The <b>Files</b> tab of the sidebar lists the files of all agents, with a search box, the filters Agent and Type, and a sort. A file with an image of 1 MB or less shows a thumbnail. A click on a file opens the viewer. <b>Full screen</b>, <b>Download</b>, <b>Copy link</b>, <b>Compare</b> and <b>Delete</b> act on the shown version. <b>Close full screen</b> ends full screen, and Escape does too when the focus is not in the file. Ctrl+G F shows the Files tab. Ctrl+G A shows the Claude agent tab. After <b>Delete</b>, <b>Undo</b> shows for 10 seconds. A new file gives a line in the chat, a badge on the node and a dot on the Files tab button. On a touch screen the buttons show their names. A file opens in full screen when the sidebar is too small for a preview. Ctrl+G F and Ctrl+G A move the focus into the tab. The <b>Files</b> page shows the same list and viewer at the size of the editor. Open it with <b>View &gt; Files page</b>, with Ctrl+G Shift+F, or with the URL hash <code>#files</code>. <b>Show agent</b> closes the page and opens the popup of the agent. <b>Close</b> closes the page. Escape ends full screen first, then closes the page. See the README.</p>

    <h3>MQTT inbox</h3>
    <p>The popup shows the text of the agent as markdown: headings, lists, tables, code, links and emphasis. A link opens in a new tab. An image or other remote file does not show. The text of the operator and of a question stays plain text. The Agents tab shows an inbox message as a closed card on the left (the sender, the time and the first 3 lines) and a message that the agent sent with <code>send</code> as a card on the right (the receiver, the time and the first 3 lines). A click on a longer card opens the full text in the card, and a second click closes it. The badge of the tab counts the received messages that came while it was not shown. The Chat tab shows none of them. The Timeline tab shows the full text too. A keep-alive turn has no bubble: the life cycle line shows it.</p>
    <p>The address of the agent is <code>&lt;team&gt;/&lt;name&gt;</code>: the tab label and the node name. <code>/ + #</code> and white space become <code>-</code>. A node with no name gets no inbox.</p>
    <p>The inbox topic is <code>agents/&lt;team&gt;/agent/&lt;name&gt;/inbox</code> (QoS 1). The payload is JSON <code>{ "from": "&lt;team&gt;/&lt;name&gt;", "text": "..." }</code>. Other payloads give a warning. An inbox message starts a turn in both session modes. Its result goes out on output 1 as a new msg.</p>
    <p>The agent gets the tool <code>send(to, text)</code>. <code>to</code> is <code>name</code> (same team) or <code>team/name</code>. With no broker connection, the tool gives an error text. A send that has no answer yet keeps the session open with keep-alive turns. With <code>report: true</code> the text is a report that expects no answer: the send opens no item and causes no keep-alive turn.</p>
</script>
