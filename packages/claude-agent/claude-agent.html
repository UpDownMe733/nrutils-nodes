<script type="text/javascript" src="node-red-resourceendpoint/node-red-popup/NodeRedPopupFrontend.js"></script>
<script type="text/javascript" src="node-red-resourceendpoint/node-red-editorcomms/EditorCommsFrontend.js"></script>

<script type="text/javascript">
(function () {
    const NODE_COLOR = '#9fd8d0';
    const activeRuns = {};      // nodeId to the active runs of the runtime node
    const lastEnd = {};         // nodeId to the end of the last run: the result line, "stopped" or the error
    const views = {};           // nodeId to the popup tab: 'chat' (the default), 'agents' or 'timeline'. Survives a popup rebuild.
    const sessions = {};        // nodeId to the last session of the runtime node: { cacheTtl, lastActivity, model }
    const unread = {};          // nodeId to the count of agent messages that came while the Agents tab was not shown
    const popups = {};          // nodeId to the node of each popup that the editor has built
    let chipTimer = null;       // one timer for the chips of all popups
    const OPERATOR_KINDS = ['prompt', 'message', 'answer'];
    const AGENT_KINDS = ['text', 'question'];
    const END_KINDS = ['result', 'error'];
    const MAX_ENTRIES = 200;

    // The look of the popup. It uses the theme variables of Node-RED, so it follows the light and the dark theme.
    // The operator bubble has the node colour with dark text: that has contrast in both themes.
    const STYLE = `
.ca-popup{display:flex;flex-direction:column;gap:6px;height:100%;min-height:0;min-width:0;font-size:12px;color:var(--red-ui-primary-text-color);cursor:default;user-select:text}
.ca-popup button{user-select:none}
.ca-name,.ca-summary,.ca-about,.ca-chip,.ca-meta,.ca-empty,.ca-working,.ca-bubble,.ca-inbox,.ca-inbox-text,.ca-log{cursor:text}
.ca-popup button,.ca-tab{cursor:pointer}
.ca-spacer{cursor:move}
.ca-identity{flex:none;display:flex;flex-direction:column;min-width:0;padding:0 2px 2px}
.ca-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;font-weight:600;color:var(--red-ui-primary-text-color)}
.ca-summary{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--red-ui-secondary-text-color)}
.ca-about{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;color:var(--red-ui-secondary-text-color)}
.ca-header{flex:none;display:flex;align-items:center;gap:6px;min-width:0;border-bottom:1px solid var(--red-ui-secondary-border-color)}
.ca-tab{flex:none;background:none;border:none;border-bottom:2px solid transparent;margin:0 0 -1px;padding:3px 4px;font:inherit;cursor:pointer;color:var(--red-ui-secondary-text-color)}
.ca-tab:hover{color:var(--red-ui-primary-text-color)}
.ca-tab.selected{color:var(--red-ui-primary-text-color);border-bottom-color:var(--red-ui-text-color-link);font-weight:600}
.ca-spacer{flex:1;align-self:stretch;min-width:0}
.ca-header select{flex:none;width:auto;max-width:90px;height:22px;margin:0;padding:0 2px;font-size:11px}
.ca-chip{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;font-variant-numeric:tabular-nums;padding:1px 7px;border-radius:10px;border:1px solid var(--red-ui-secondary-border-color);background:var(--red-ui-tertiary-background);color:var(--red-ui-secondary-text-color)}
.ca-chip.ca-warn{color:var(--red-ui-text-color-warning);border-color:var(--red-ui-border-color-warning)}
.ca-header .red-ui-button{flex:none;margin:0 0 2px}
.ca-log{flex:1;min-height:0;overflow:auto;font-family:monospace;font-size:11px;white-space:pre-wrap;overflow-wrap:anywhere}
.ca-chat,.ca-agents{flex:1;min-height:0;overflow:auto;flex-direction:column;gap:6px;padding:2px}
.ca-list{display:flex;flex-direction:column;gap:6px}
.ca-msg{display:flex;flex-direction:column;max-width:85%;min-width:0}
.ca-op{align-self:flex-end;align-items:flex-end}
.ca-agent{align-self:flex-start;align-items:flex-start}
.ca-meta{margin:0 4px 2px;font-size:10px;color:var(--red-ui-tertiary-text-color)}
.ca-bubble{font-size:13px;line-height:1.4;padding:6px 10px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.ca-op .ca-bubble{background:${NODE_COLOR};color:#000;border-bottom-right-radius:4px}
.ca-agent .ca-bubble{background:var(--red-ui-tertiary-background);color:var(--red-ui-primary-text-color);border:1px solid var(--red-ui-secondary-border-color);border-bottom-left-radius:4px}
.ca-question .ca-bubble{border-left:3px solid var(--red-ui-border-color-warning);border-radius:6px}
.ca-bubble.ca-md{white-space:normal}
.ca-md>:first-child{margin-top:0}
.ca-md>:last-child{margin-bottom:0}
.ca-md p,.ca-md ul,.ca-md ol,.ca-md pre,.ca-md table,.ca-md blockquote{margin:0 0 6px}
.ca-md ul,.ca-md ol{padding-left:18px}
.ca-md li{margin:1px 0}
.ca-md h1,.ca-md h2,.ca-md h3,.ca-md h4,.ca-md h5,.ca-md h6{margin:8px 0 4px;font-size:13px;line-height:1.3;font-weight:700;color:var(--red-ui-primary-text-color)}
.ca-md h1{font-size:15px}
.ca-md h2{font-size:14px}
.ca-md a{color:var(--red-ui-text-color-link);text-decoration:underline}
.ca-md code{font-family:monospace;font-size:12px;padding:0 3px;border-radius:3px;background:var(--red-ui-primary-background);color:var(--red-ui-text-color-code);border:1px solid var(--red-ui-tertiary-border-color)}
.ca-md pre{padding:6px 8px;border-radius:4px;overflow-x:auto;white-space:pre;background:var(--red-ui-primary-background);border:1px solid var(--red-ui-secondary-border-color)}
.ca-md pre code{padding:0;border:none;background:none;color:var(--red-ui-primary-text-color)}
.ca-md table{border-collapse:collapse;display:block;max-width:100%;overflow-x:auto;font-size:12px}
.ca-md th,.ca-md td{padding:2px 6px;border:1px solid var(--red-ui-secondary-border-color);text-align:left}
.ca-md th{background:var(--red-ui-secondary-background);font-weight:600}
.ca-md blockquote{padding-left:8px;border-left:3px solid var(--red-ui-secondary-border-color);color:var(--red-ui-secondary-text-color)}
.ca-md hr{border:none;border-top:1px solid var(--red-ui-secondary-border-color);margin:6px 0}
.ca-inbox{flex:none;min-height:44px;box-sizing:border-box;max-width:85%;padding:4px 10px 6px;border-radius:6px;border:1px solid var(--red-ui-secondary-border-color);border-left:3px solid var(--red-ui-secondary-text-color);background:var(--red-ui-secondary-background)}
.ca-inbox.ca-sent{align-self:flex-end;border-left-width:1px;border-right:3px solid var(--red-ui-text-color-link)}
.ca-badge{margin-left:4px;padding:0 5px;min-width:16px;border-radius:8px;font-size:10px;line-height:16px;font-weight:600;text-align:center;background:var(--red-ui-text-color-link);color:var(--red-ui-primary-background)}
.ca-inbox.ca-more,.ca-inbox.ca-open{cursor:pointer}
.ca-inbox:focus-visible{outline:1px solid var(--red-ui-form-input-focus-color)}
.ca-inbox .ca-meta{display:flex;align-items:center;gap:6px;margin:0 0 2px;font-size:11px;font-weight:600;color:var(--red-ui-secondary-text-color)}
.ca-inbox .ca-meta i{display:none;margin-left:auto;font-size:16px;line-height:1;color:var(--red-ui-primary-text-color);transition:transform .15s}
.ca-inbox.ca-more .ca-meta i,.ca-inbox.ca-open .ca-meta i{display:inline}
.ca-inbox.ca-open .ca-meta i{transform:rotate(180deg)}
.ca-inbox-text{font-size:12px;line-height:1.4;max-height:calc(3 * 1.4em);overflow:hidden;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--red-ui-primary-text-color)}
.ca-inbox.ca-more:not(.ca-open) .ca-inbox-text{-webkit-mask-image:linear-gradient(#000 60%,transparent);mask-image:linear-gradient(#000 60%,transparent)}
.ca-inbox.ca-open .ca-inbox-text{max-height:none;overflow:visible}
.ca-end{align-self:center;font-size:10px;padding:1px 8px;border-radius:10px;background:var(--red-ui-tertiary-background);color:var(--red-ui-secondary-text-color)}
.ca-end.ca-error{color:var(--red-ui-text-color-error);border:1px solid var(--red-ui-border-color-error)}
.ca-end.ca-life{font-style:italic;border:1px dashed var(--red-ui-secondary-border-color)}
.ca-empty{margin:auto;padding:12px;text-align:center;font-style:italic;color:var(--red-ui-tertiary-text-color)}
.ca-working{align-self:flex-start;font-size:11px;font-style:italic;color:var(--red-ui-secondary-text-color)}
.ca-ask{flex:none;padding:6px 8px;border-radius:6px;border:1px solid var(--red-ui-border-color-warning);background:var(--red-ui-form-tips-background);color:var(--red-ui-primary-text-color)}
.ca-ask .red-ui-button{margin:4px 4px 0 0}
.ca-composer{flex:none;display:flex;flex-direction:column;border:1px solid var(--red-ui-form-input-border-color);border-radius:8px;background:var(--red-ui-form-input-background)}
.ca-composer:focus-within{border-color:var(--red-ui-form-input-focus-color);box-shadow:0 0 0 1px var(--red-ui-form-input-focus-color)}
.ca-composer textarea{display:block;width:100%;height:auto;min-height:0;max-height:calc(6 * 1.4em + 8px);box-sizing:border-box;margin:0;padding:6px 8px 2px;resize:none;overflow-y:auto;font:inherit;font-size:13px;line-height:1.4;border:none !important;outline:none;box-shadow:none !important;background:transparent;color:var(--red-ui-form-text-color)}
.ca-footer{display:flex;align-items:center;justify-content:flex-end;gap:4px;min-width:0;padding:2px 4px 4px 8px}
.ca-footer .red-ui-button{flex:none}
`;

    function addStyle() {
        if (document.getElementById('claude-agent-style')) return;
        const style = make('style', STYLE);
        style.id = 'claude-agent-style';
        document.head.appendChild(style);
    }

    function make(tag, text, className) {
        const e = document.createElement(tag);
        if (text) e.textContent = text;
        if (className) e.className = className;
        return e;
    }

    // A small button of Node-RED with an icon, a label and a title
    function button(icon, label, title) {
        const b = make('button', '', 'red-ui-button red-ui-button-small');
        b.type = 'button';
        if (icon) b.appendChild(make('i', '', 'fa ' + icon));
        if (label) b.appendChild(make('span', (icon ? ' ' : '') + label));
        if (title) b.title = title;
        return b;
    }

    // A popup element of the node: identity, name, summary, about, log, chat, list, empty, working, ask, run, chip, new, text, send, interrupt or stop
    function part(node, name) {
        return document.getElementById('claude-agent-' + name + '-' + node.id);
    }

    // The model of the selected run as family and version, for example "opus 5.5". An ID of another format shows in full.
    // With no run, it is the model of the last run. With no run since the start, it is the model of the node.
    // A node model of a different family shows after it, for example "opus 5.5 (node: sonnet)".
    function modelText(node) {
        const run = selectedRun(node);
        const session = sessions[node.id];
        const id = (run && run.model) || (session && session.model);
        if (!id) return node.model || 'default model';
        const found = /claude-([a-z]+)-(\d+)-(\d{1,2})(?!\d)/.exec(id);
        const text = found ? found[1] + ' ' + found[2] + '.' + found[3] : id;
        return node.model && !(found && found[1] === node.model) ? text + ' (node: ' + node.model + ')' : text;
    }

    // Show the name of the node and its settings at the top of the popup. The text is set with textContent only.
    function showIdentity(node) {
        const identity = part(node, 'identity');
        if (!identity) return;
        const about = [modelText(node), node.cwd || 'work root'];
        if (node.sandbox) about.push('sandbox ' + node.sandbox);
        const summary = String(node.summary || '').trim();
        for (const [name, text] of [['name', node.name || 'claude-agent'], ['summary', summary], ['about', about.join(' · ')]]) {
            const line = part(node, name);
            // A line with the same text stays as it is, so a selection in it stays
            if (line.textContent !== text) line.textContent = text;
            line.title = text;
        }
        part(node, 'summary').style.display = summary ? '' : 'none';
    }

    const pad = (n) => String(n).padStart(2, '0');
    const clock = (time) => { const d = new Date(time); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };

    function selectedRun(node) {
        const runs = activeRuns[node.id] || [];
        const select = part(node, 'run');
        return runs.find((r) => select && r.runId === select.value) || runs[0];
    }

    // Show the selected run in the status line, the question block, the working line and the buttons.
    function showRun(node) {
        showIdentity(node);
        const run = selectedRun(node);
        const status = document.getElementById('nru_popup.' + node.id + '.statusText');
        if (status) {
            status.setStatusText(run ? [run.state, run.turns + (run.turns === 1 ? ' turn' : ' turns'), run.tokens, run.context && 'context ' + run.context].filter(Boolean).join(', ')
                : lastEnd[node.id] || 'no active run');
        }
        const ask = part(node, 'ask');
        if (!ask) return;
        showChip(node);
        part(node, 'new').disabled = (activeRuns[node.id] || []).length > 0;
        const working = !!(run && (run.state === 'starting' || run.state === 'running'));
        part(node, 'working').style.display = working ? '' : 'none';
        for (const name of ['interrupt', 'stop']) part(node, name).style.display = run ? '' : 'none';
        const waiting = !!(run && run.state === 'waiting' && run.question);
        ask.textContent = '';
        ask.style.display = waiting ? '' : 'none';
        part(node, 'send-label').textContent = ' ' + (waiting ? 'Answer' : 'Send');
        part(node, 'text').placeholder = waiting ? 'Your answer' : 'Message to the agent';
        if (!waiting) return;
        ask.appendChild(make('div', 'Agent asks: ' + run.question.question));
        for (const option of run.question.options) {
            const b = button('', option);
            b.addEventListener('click', () => sendControl(node, 'answer', option));
            ask.appendChild(b);
        }
    }

    function showRuns(node, runs) {
        activeRuns[node.id] = runs;
        const select = part(node, 'run');
        if (!select) return;
        const keep = select.value;
        select.textContent = '';
        for (const run of runs) {
            const option = make('option', run.runId);
            option.value = run.runId;
            select.appendChild(option);
        }
        if (runs.some((r) => r.runId === keep)) select.value = keep;
        select.style.display = runs.length > 1 ? '' : 'none';
        showRun(node);
    }

    // live is true for an event that comes from the runtime now, false for the log that the popup loads when it opens.
    function addEvent(node, e, live) {
        if (e.kind === 'result') lastEnd[node.id] = e.text;
        else if (e.kind === 'error') lastEnd[node.id] = 'error: ' + e.text;
        else if (e.kind === 'state' && e.text === 'stopped') lastEnd[node.id] = 'stopped';
        const log = part(node, 'log');
        if (!log) return;
        const runId = (activeRuns[node.id] || []).length > 1 ? e.runId + ' ' : '';
        log.appendChild(make('div', new Date(e.time).toLocaleTimeString() + ' ' + runId + e.kind + ': ' + e.text));
        while (log.childNodes.length > MAX_ENTRIES) log.removeChild(log.firstChild);
        log.scrollTop = log.scrollHeight;
        addChat(node, e);
        addAgents(node, e, live);
    }

    // Agent text is markdown. The HTML passes DOMPurify twice: renderMarkdown returns the raw text when marked fails.
    // DOMPurify drops each tag and attribute that makes the browser load a remote file, so the agent text cannot call a server.
    const PURIFY = {
        FORBID_TAGS: ['img', 'picture', 'source', 'video', 'audio', 'track', 'iframe', 'object', 'embed', 'style', 'link'],
        FORBID_ATTR: ['style', 'poster', 'srcset', 'src']
    };

    // A link opens in a new tab.
    function renderMarkdown(bubble, text) {
        bubble.className += ' ca-md';
        bubble.innerHTML = DOMPurify.sanitize(RED.utils.renderMarkdown(text), PURIFY);
        bubble.querySelectorAll('a').forEach((a) => {
            a.setAttribute('target', '_blank');
            a.setAttribute('rel', 'noopener noreferrer');
        });
    }

    // A message of the Agents tab: a closed card with the sender or the receiver, the time and the first 3 lines.
    // A received message is on the left, a sent message on the right.
    // A card with more text than 3 lines gets the class ca-more: an arrow shows, and a click or Enter opens the full text.
    // The next click closes it. A click that ends a text selection in the card does not.
    function inboxCard(e) {
        const sent = e.kind === 'sent';
        const card = make('div', '', 'ca-msg ca-inbox' + (sent ? ' ca-sent' : ''));
        const meta = make('div', (sent ? 'To ' + e.to : 'From ' + e.from) + ' · ' + clock(e.time), 'ca-meta');
        const text = make('div', e.text, 'ca-inbox-text');
        meta.appendChild(make('i', '', 'fa fa-angle-down'));
        card.appendChild(meta);
        card.appendChild(text);
        const toggle = () => {
            if (!card.classList.contains('ca-more') && !card.classList.contains('ca-open')) return;
            card.setAttribute('aria-expanded', String(card.classList.toggle('ca-open')));
        };
        card.addEventListener('click', () => {
            const s = window.getSelection && window.getSelection();
            if (!s || s.isCollapsed || !card.contains(s.anchorNode)) toggle();
        });
        card.addEventListener('keydown', (k) => {
            if (k.target !== card || (k.key !== 'Enter' && k.key !== ' ')) return;
            k.preventDefault();
            toggle();
        });
        // The measure runs at the first layout, at a resize of the popup and when the hidden tab shows.
        if (typeof ResizeObserver === 'function') {
            new ResizeObserver(() => {
                if (card.classList.contains('ca-open')) return;
                const more = text.scrollHeight > text.clientHeight + 1;
                card.classList.toggle('ca-more', more);
                if (more) {
                    card.tabIndex = 0;
                    card.setAttribute('role', 'button');
                    card.setAttribute('aria-expanded', 'false');
                } else {
                    card.removeAttribute('tabindex');
                    card.removeAttribute('role');
                    card.removeAttribute('aria-expanded');
                }
            }).observe(text);
        }
        return card;
    }

    // The chat tab: operator bubbles on the right, agent bubbles on the left, the end of a run as a pill
    function addChat(node, e) {
        const list = part(node, 'list');
        if (!list) return;
        let entry;
        // A keep-alive or close prompt is not text of the operator: the life cycle pill shows it.
        if (e.kind === 'prompt' && e.source === 'life') return;
        if (e.kind === 'prompt' && e.source === 'agent') return;
        if (OPERATOR_KINDS.includes(e.kind) || AGENT_KINDS.includes(e.kind)) {
            const operator = OPERATOR_KINDS.includes(e.kind);
            const runId = (activeRuns[node.id] || []).length > 1 && !operator ? ' ' + e.runId : '';
            entry = make('div', '', 'ca-msg ' + (operator ? 'ca-op' : 'ca-agent') + (e.kind === 'question' ? ' ca-question' : ''));
            entry.appendChild(make('div', (operator ? 'You' : 'Agent' + runId) + ' · ' + clock(e.time), 'ca-meta'));
            const bubble = make('div', e.kind === 'question' ? 'Question: ' + e.text : operator ? e.text : '', 'ca-bubble');
            if (e.kind === 'text') renderMarkdown(bubble, e.text);
            entry.appendChild(bubble);
        } else if (e.kind === 'life') {
            // A keep-alive, a close, a note or a handoff of the session mode agent
            entry = make('div', 'life cycle: ' + e.text, 'ca-end ca-life');
        } else if (END_KINDS.includes(e.kind) || (e.kind === 'state' && e.text === 'stopped')) {
            entry = make('div', e.kind === 'error' ? 'error: ' + e.text : e.text, 'ca-end' + (e.kind === 'error' ? ' ca-error' : ''));
        } else return;
        list.appendChild(entry);
        while (list.childNodes.length > MAX_ENTRIES) list.removeChild(list.firstChild);
        part(node, 'empty').style.display = 'none';
        const chat = part(node, 'chat');
        chat.scrollTop = chat.scrollHeight;
    }

    // The Agents tab: the messages that the agent got from other agents and the messages that it sent, oldest at the top.
    // A live received message that comes while the tab is not shown adds to the badge of the tab. A sent message does not.
    function addAgents(node, e, live) {
        const list = part(node, 'agents');
        if (!list || !((e.kind === 'prompt' && e.source === 'agent') || e.kind === 'sent')) return;
        list.appendChild(inboxCard(e));
        while (list.childNodes.length > MAX_ENTRIES) list.removeChild(list.firstChild);
        if (views[node.id] === 'agents') list.scrollTop = list.scrollHeight;
        else if (live && e.kind === 'prompt') showBadge(node, (unread[node.id] || 0) + 1);
    }

    // The badge after the label of the Agents tab: hidden at 0, "99+" above 99
    function showBadge(node, count) {
        unread[node.id] = count;
        const badge = part(node, 'badge');
        if (!badge) return;
        badge.textContent = count > 99 ? '99+' : String(count);
        badge.style.display = count ? '' : 'none';
    }

    // Show one tab of the popup
    function showView(node, view) {
        views[node.id] = view;
        const panes = { chat: part(node, 'chat'), agents: part(node, 'agents'), timeline: part(node, 'log') };
        for (const [name, pane] of Object.entries(panes)) {
            pane.style.display = name !== view ? 'none' : name === 'timeline' ? '' : 'flex';
            part(node, 'tab-' + name).classList.toggle('selected', name === view);
        }
        if (view === 'agents') showBadge(node, 0);
        panes[view].scrollTop = panes[view].scrollHeight;
    }

    function sendControl(node, cmd, text) {
        const run = selectedRun(node);
        if (!run && cmd !== 'message') return RED.notify('No active run', 'warning');
        const request = run ? node.nodeRedEditorComms.publish('control', { cmd: cmd, runId: run.runId, text: text })
            : node.nodeRedEditorComms.publish('start', { text: text });
        request
            .then((res) => { if (res && res.error) RED.notify(res.error, 'warning'); })
            .catch((err) => RED.notify(err.status === 404 ? 'Deploy the node first' : err.message, 'warning'));
    }

    // The text of the timer chip. Active: the time since the start of the selected run.
    // Cache: the minutes until the prompt cache expires. Each model response restarts the cache time.
    function chipState(node, run, now) {
        const session = sessions[node.id] || { cacheTtl: node.cacheTtl === '5m' ? '5m' : '1h', lastActivity: null };
        const ttlMin = session.cacheTtl === '5m' ? 5 : 60;
        const since = run ? run.lastActivity : session.lastActivity;
        const info = 'Cache: the estimated time until the ' + ttlMin + '-minute prompt cache expires. Each model response starts it again.';
        let cache = 'Cache --';
        let title = info;
        let warn = false;
        if (typeof since === 'number') {
            const left = since + ttlMin * 60000 - now;
            warn = left <= 5 * 60000;
            if (left > 0) {
                cache = 'Cache ' + pad(Math.ceil(left / 60000)) + 'm';
            } else {
                cache = 'Cache cold';
                title = 'The prompt cache has expired. The next message reads the full context again at the full price.';
            }
        } else if (!run) {
            return { text: 'New chat', title: 'The next message starts a new session.', warn: false };
        }
        if (!run) return { text: cache, title: title, warn: warn };
        const min = Math.max(0, Math.floor((now - run.startTime) / 60000));
        const active = min >= 60 ? Math.floor(min / 60) + 'h ' + pad(min % 60) + 'm' : min + 'm';
        return { text: 'Active ' + active + ' · ' + cache, title: 'Active: the time since the run started.\n' + title, warn: warn };
    }

    function showChip(node) {
        const chip = part(node, 'chip');
        if (!chip) return false;
        const state = chipState(node, selectedRun(node), Date.now());
        chip.textContent = state.text;
        chip.title = state.title;
        chip.classList.toggle('ca-warn', state.warn);
        return true;
    }

    // Update the chips of all popups every 10 s. A popup without a chip leaves the list. The timer stops when the list is empty.
    function startChipTimer() {
        if (chipTimer) return;
        chipTimer = setInterval(() => {
            for (const node of Object.values(popups)) if (!showChip(node)) delete popups[node.id];
            if (!Object.keys(popups).length) {
                clearInterval(chipTimer);
                chipTimer = null;
            }
        }, 10000);
    }

    // New chat: the runtime forgets the last session and clears the popup log
    function newChat(node) {
        node.nodeRedEditorComms.publish('new-chat')
            .then((res) => { if (res && res.error) RED.notify(res.error, 'warning'); })
            .catch((err) => RED.notify(err.status === 404 ? 'Deploy the node first' : err.message, 'warning'));
        const text = part(node, 'text');
        if (text) text.focus();
    }

    // The runtime has cleared its log: empty the chat and the Timeline
    function clear(node) {
        delete lastEnd[node.id];
        showBadge(node, 0);
        for (const name of ['list', 'agents', 'log']) {
            const e = part(node, name);
            if (e) e.textContent = '';
        }
        const empty = part(node, 'empty');
        if (empty) empty.style.display = '';
        showRun(node);
    }

    // The message box grows with its text, up to about 6 lines. Then it scrolls.
    function grow(text) {
        text.style.height = 'auto';
        if (text.scrollHeight) text.style.height = text.scrollHeight + 'px';
    }

    // Build one popup element with the id claude-agent-<name>-<nodeId>
    function element(node, tag, name, className, text) {
        const e = make(tag, text, className);
        e.id = 'claude-agent-' + name + '-' + node.id;
        return e;
    }

    // An open popup shows the new name and settings when the edit dialog closes
    if (RED.events) RED.events.on('nodes:change', (n) => { if (n && popups[n.id]) showIdentity(n); });

    // The start of a system prompt as one short line: the first sentence of the first line, without markdown marks.
    // It has at most 120 characters. The editor button uses it. The popup never reads the system prompt.
    const SUMMARY_MAX = 120;
    function summaryFromPrompt(text) {
        let line = '';
        for (const l of String(text || '').split(/\r?\n/)) {
            const t = l.trim().replace(/^(?:[#>\-*+]+|\d+\.)(?:\s+|$)/, '').replace(/\*\*|__|`/g, '').replace(/\s+/g, ' ').trim();
            // A line of only marks, like --- or ###, has no text: skip it
            if (/[\p{L}\p{N}]/u.test(t)) { line = t; break; }
        }
        if (!line) return '';
        const end = line.search(/[.!?](?:\s|$)/);
        if (end >= 0) line = line.slice(0, end + 1);
        if (line.length <= SUMMARY_MAX) return line;
        const limit = SUMMARY_MAX - 3;
        let cut = line.slice(0, limit);
        if (line[limit] !== ' ' && cut.includes(' ')) cut = cut.slice(0, cut.lastIndexOf(' '));
        return cut.trimEnd() + '\u2026';
    }

    RED.nodes.registerType('claude-agent', {
        category: 'agents',
        color: NODE_COLOR,
        defaults: {
            name: { value: '' },
            summary: { value: '' },
            systemPrompt: { value: '' },
            model: { value: '' },
            effort: { value: '' },
            cacheTtl: { value: '1h' },
            session: { value: 'message' },
            contextLimit: { value: 100000, validate: RED.validators.number(true) },
            maxKeepAlive: { value: 3, validate: RED.validators.number(true) },
            broker: { value: '', type: 'mqtt-broker', required: false },
            prompt: { value: '{{payload}}' },
            cwd: { value: '' },
            sandbox: {
                value: '',
                // The rule comes from claudeAgent.sandboxPattern in settings.js. The runtime checks the name again.
                validate: function (v) {
                    const rule = (RED.settings.claudeAgent || {}).sandboxPattern;
                    try { return !v || !rule || new RegExp(rule).test(v); } catch (e) { return true; }
                }
            },
            tools: { value: 'Read, Grep, Glob' },
            projectSettings: { value: false },
            fullEnvironment: { value: false },
            maxTurns: { value: 30, validate: RED.validators.number() },
            maxCostUsd: { value: 2, validate: RED.validators.number(true) },
            timeoutMin: { value: 30, validate: RED.validators.number(true) },
            maxParallel: { value: 1, validate: RED.validators.number() },
            outputSchema: {
                value: '',
                validate: function (v) {
                    try { return !v || (JSON.parse(v), true); } catch (e) { return false; }
                }
            },
            mcpServers: {
                value: '',
                validate: function (v) {
                    try { return !v || (JSON.parse(v), true); } catch (e) { return false; }
                }
            },
            nru_popupConfig: { value: { width: 480, height: 420, autoCloseTime: 0 } }
        },
        inputs: 1,
        outputs: 3,
        outputLabels: ['result', 'question', 'events'],
        icon: 'claude-agent.svg',
        label: function () { return this.name || 'claude-agent'; },
        paletteLabel: 'claude-agent',
        summaryFromPrompt: summaryFromPrompt,

        // A node from before the Cache time property has no value. The dialog shows 60 minutes, as the runtime uses.
        oneditprepare: function () {
            if (this.cacheTtl !== '5m' && this.cacheTtl !== '1h') $('#node-input-cacheTtl').val('1h');
            // A node from before the Session property runs in the message mode. The agent settings show only in the agent mode.
            if (this.session !== 'agent') $('#node-input-session').val('message');
            const session = $('#node-input-session');
            session.on('change', () => $('.claude-agent-agent-row').toggle(session.val() === 'agent'));
            session.trigger('change');
            // The button copies the start of the current, unsaved system prompt. Done saves it.
            $('#claude-agent-summary-from-prompt').on('click', function () {
                const prompt = $('#node-input-systemPrompt').val();
                if (!String(prompt || '').trim()) { RED.notify('The system prompt is empty.', 'warning'); return; }
                $('#node-input-summary').val(summaryFromPrompt(prompt));
            });
        },

        // Runs each time the editor builds the popup
        nru_popupInit: function () {
            const node = this;
            const div = document.getElementById('nru_popup.' + node.id + '.div');
            if (!div) return;
            div.textContent = '';
            // Keep mouse, key and wheel events in the popup. If they reach the node, Node-RED gives the focus to the canvas,
            // and the text box gets no keys.
            if (!div.claudeAgentEventsKept) {
                div.claudeAgentEventsKept = true;
                for (const type of ['mousedown', 'mouseup', 'click', 'dblclick', 'touchstart', 'touchend', 'keydown', 'keyup', 'keypress', 'wheel', 'contextmenu']) {
                    div.addEventListener(type, (e) => e.stopPropagation());
                }
            }
            addStyle();
            const root = make('div', '', 'ca-popup');

            const identity = element(node, 'div', 'identity', 'ca-identity');
            identity.appendChild(element(node, 'div', 'name', 'ca-name'));
            identity.appendChild(element(node, 'div', 'summary', 'ca-summary'));
            identity.appendChild(element(node, 'div', 'about', 'ca-about'));

            const header = make('div', '', 'ca-header');
            for (const [view, label] of [['chat', 'Chat'], ['agents', 'Agents'], ['timeline', 'Timeline']]) {
                const tab = element(node, 'button', 'tab-' + view, 'ca-tab', label);
                tab.type = 'button';
                tab.addEventListener('click', () => showView(node, view));
                if (view === 'agents') {
                    const badge = element(node, 'span', 'badge', 'ca-badge');
                    badge.style.display = 'none';
                    tab.appendChild(badge);
                }
                header.appendChild(tab);
            }
            // The empty part of the tab row moves the popup: it gives the mouse press to the title bar of the frame
            const spacer = make('div', '', 'ca-spacer');
            spacer.addEventListener('mousedown', (e) => {
                const bar = document.getElementById('nru_popup.' + node.id + '.header');
                if (!bar) return;
                e.preventDefault();
                bar.dispatchEvent(new MouseEvent('mousedown', { clientX: e.clientX, clientY: e.clientY, bubbles: true, cancelable: true }));
            });
            header.appendChild(spacer);
            const select = element(node, 'select', 'run');
            select.title = 'The active run that the popup shows';
            select.style.display = 'none';
            select.addEventListener('change', () => showRun(node));
            const chip = element(node, 'span', 'chip', 'ca-chip');
            const fresh = button('fa-plus', '', 'New chat: the next message starts a new session. Stop the active run first.');
            fresh.id = 'claude-agent-new-' + node.id;
            fresh.addEventListener('click', () => newChat(node));
            for (const e of [select, chip, fresh]) header.appendChild(e);

            const log = element(node, 'div', 'log', 'ca-log');
            const agents = element(node, 'div', 'agents', 'ca-agents');
            const chat = element(node, 'div', 'chat', 'ca-chat');
            chat.appendChild(element(node, 'div', 'empty', 'ca-empty', 'Ask the agent a question below.'));
            chat.appendChild(element(node, 'div', 'list', 'ca-list'));
            const working = element(node, 'div', 'working', 'ca-working');
            working.appendChild(make('i', '', 'fa fa-circle-o-notch fa-spin'));
            working.appendChild(make('span', ' Agent is working…'));
            working.style.display = 'none';
            chat.appendChild(working);
            const ask = element(node, 'div', 'ask', 'ca-ask');
            ask.style.display = 'none';

            const composer = make('div', '', 'ca-composer');
            const text = element(node, 'textarea', 'text');
            text.rows = 1;
            text.placeholder = 'Message to the agent';
            text.addEventListener('input', () => grow(text));
            const footer = make('div', '', 'ca-footer');
            const interrupt = button('fa-pause', 'Interrupt', 'Stop the current turn. The run stays open for a new message.');
            interrupt.id = 'claude-agent-interrupt-' + node.id;
            const stop = button('fa-stop', 'Stop', 'End the run');
            stop.id = 'claude-agent-stop-' + node.id;
            const send = button('fa-paper-plane', '', 'Send the message');
            send.id = 'claude-agent-send-' + node.id;
            send.className += ' primary';
            send.appendChild(element(node, 'span', 'send-label', '', ' Send'));
            send.addEventListener('click', () => {
                const run = selectedRun(node);
                sendControl(node, run && run.state === 'waiting' ? 'answer' : 'message', text.value);
                text.value = '';
                grow(text);
            });
            // Enter sends. Shift+Enter starts a new line. Enter that ends an IME composition does not send.
            text.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
                    e.preventDefault();
                    send.click();
                }
            });
            interrupt.addEventListener('click', () => sendControl(node, 'interrupt'));
            stop.addEventListener('click', () => sendControl(node, 'stop'));
            for (const e of [interrupt, stop, send]) footer.appendChild(e);
            composer.appendChild(text);
            composer.appendChild(footer);

            for (const e of [identity, header, log, agents, chat, ask, composer]) root.appendChild(e);
            div.appendChild(root);
            showIdentity(node);
            showView(node, views[node.id] || 'chat');
            showBadge(node, views[node.id] === 'agents' ? 0 : unread[node.id] || 0);
            showRun(node);
            popups[node.id] = node;
            startChipTimer();

            node.nodeRedEditorComms.publish('get-log').then((state) => {
                if (state.session) sessions[node.id] = state.session;
                for (const e of state.events) addEvent(node, e, false);
                showRuns(node, state.runs);
                // The frame of the popup shows and hides the pane again after the log comes, and each show puts the scroll at the top.
                // Keep the newest message in view each time the pane gets a size, until the user scrolls it.
                const pane = part(node, views[node.id] === 'agents' ? 'agents' : views[node.id] === 'timeline' ? 'log' : 'chat');
                if (!pane || typeof ResizeObserver !== 'function') return;
                const watch = new ResizeObserver(() => {
                    if (pane.clientHeight) pane.scrollTop = pane.scrollHeight;
                });
                const release = () => watch.disconnect();
                for (const type of ['wheel', 'touchstart', 'mousedown', 'keydown']) pane.addEventListener(type, release, { once: true });
                watch.observe(pane);
            }).catch(() => showRuns(node, []));
        },
        nodeRedEditorComms_subscriptions: {
            event: function (e) { addEvent(this, e, true); },
            runs: function (runs) { showRuns(this, runs); },
            session: function (session) { sessions[this.id] = session; showIdentity(this); showChip(this); },
            cleared: function () { clear(this); }
        }
    });
})();
</script>

<script type="text/html" data-help-name="claude-agent">
    <p>Runs one Claude Code agent for each start message. The node is one stage of an agent workflow. A wire gives the result to the next stage.</p>
    <p>The agent runs with all permissions: it gets no permission prompt. Run Node-RED or the launcher as a separate OS user, or in a container. See the README.</p>
    <p>A run loads no user settings, skills, outside MCP servers or auto memory, unless you set <b>Project settings</b> or <b>Full environment</b>.</p>

    <h3>Properties</h3>
    <dl class="message-properties">
        <dt>Name</dt><dd>The label of the node. It is also the key in <code>msg.stages</code>.</dd>
        <dt>Summary</dt><dd>A short line that the popup shows under the name. It is not sent to Claude. <b>From system prompt</b> copies the first sentence of the system prompt into the field. Check it before you click Done: the popup shows it to each person who opens the editor. Empty: no line.</dd>
        <dt>Folder</dt><dd>The work folder of the agent. It must be the work root (<code>claudeAgent.workRoot</code> in <code>settings.js</code>, default the home folder of Node-RED) or a folder below it. Empty: the work root. <code>msg.cwd</code> replaces it.</dd>
        <dt>Sandbox</dt><dd>A name that the node gives to the launcher program (<code>claudeAgent.launcher</code>) in the environment variable <code>NODE_RED_CLAUDE_SANDBOX</code>, with the folder in <code>NODE_RED_CLAUDE_CWD</code>. The launcher can then start the CLI in that container or machine. Empty: no sandbox.</dd>
        <dt>System prompt</dt><dd>It is added to the Claude Code system prompt. Empty: no extra instructions.</dd>
        <dt>Model</dt><dd>Empty: the default model. Else haiku, sonnet, opus or fable. <code>msg.model</code> replaces it.</dd>
        <dt>Effort</dt><dd>How much the model thinks: <code>low</code>, <code>medium</code>, <code>high</code>, <code>xhigh</code> or <code>max</code>. Empty: the default of the model.</dd>
        <dt>Cache time</dt><dd>How long the prompt cache of the run lives between two requests: 5 or 60 minutes. Default 60. A 60-minute cache write costs more (2&times; input, against 1.25&times;), but a run that waits for the operator longer than 5 minutes reads the cache again.</dd>
        <dt>Session</dt><dd><code>message</code> (default): each start message runs in a new session. <code>agent</code>: the node is one agent with one session that continues. See <b>Session mode agent</b> below.</dd>
        <dt>Context limit</dt><dd>Agent mode only. Above this number of tokens, the agent writes a note and a new session continues. Default 100000.</dd>
        <dt>Max keep-alive</dt><dd>Agent mode only. The number of keep-alive turns before a close. Default 3.</dd>
        <dt>MQTT broker</dt><dd>Optional. A <code>mqtt-broker</code> config node. It gives the node an inbox and the <code>send</code> tool. See <b>MQTT inbox</b> below.</dd>
        <dt>Prompt</dt><dd>A mustache template over the message, for example <code>{{payload}}</code> or <code>{{stages.triage.problem}}</code>. An object value becomes JSON.</dd>
        <dt>Tools</dt><dd>A comma list of the tools of the agent. Empty: all tools. The agent gets no permission prompt.</dd>
        <dt>Project settings</dt><dd>When set, the run loads <code>CLAUDE.md</code> and <code>.claude/settings.json</code> of the folder. Default off.</dd>
        <dt>Full environment</dt><dd>When set, the run loads the user and project settings, the user <code>CLAUDE.md</code>, the skills and the MCP servers of the OS user that runs the CLI. Auto memory stays off. Default off.</dd>
        <dt>Max turns</dt><dd>Default 30.</dd>
        <dt>Max cost ($)</dt><dd>The cost limit of one run. Default 2. Empty: no limit.</dd>
        <dt>Timeout (min)</dt><dd>The time limit of one run, also while it waits for an answer. Default 30. Empty: no limit.</dd>
        <dt>Max parallel</dt><dd>The number of runs at the same time. More start messages wait in a queue. The agent mode ignores it.</dd>
        <dt>Output schema</dt><dd>Optional JSON schema. When set, the result payload is an object that agrees with the schema.</dd>
        <dt>MCP servers</dt><dd>Optional JSON object: server name to <code>{ command, args, env }</code>. The agent gets these servers and the <code>operator</code> server.</dd>
    </dl>

    <h3>Inputs</h3>
    <p>A start message has no <code>msg.agent.cmd</code>. The rendered prompt is the task.</p>
    <dl class="message-properties">
        <dt class="optional">cwd <span class="property-type">string</span></dt><dd>The work folder for this run.</dd>
        <dt class="optional">model <span class="property-type">string</span></dt><dd><code>haiku</code>, <code>sonnet</code>, <code>opus</code> or <code>fable</code>. This run uses that model in place of the model of the node. The node ignores a different value, also a full model ID.</dd>
        <dt class="optional">agent.resume <span class="property-type">string</span></dt><dd>A session id. The run continues that session. The node ignores <code>msg.agent.sessionId</code> on a start message.</dd>
    </dl>
    <p>A control message has <code>msg.agent = { cmd, runId }</code> and a text <code>msg.payload</code>. You can omit <code>runId</code> when the node has one active run.</p>
    <ul>
        <li><code>answer</code>: the answer to the open question.</li>
        <li><code>message</code>: a new user message for the session.</li>
        <li><code>interrupt</code>: stop the current turn. The run stays open for a <code>message</code>.</li>
        <li><code>stop</code>: end the run. This is not an error. Output 1 sends nothing.</li>
    </ul>

    <h3>Outputs</h3>
    <ol class="node-ports">
        <li>Result
            <dl class="message-properties">
                <dt>payload <span class="property-type">string | object</span></dt><dd>The final text, or the schema object.</dd>
                <dt>stages <span class="property-type">object</span></dt><dd>The payload of each stage. This node adds its payload under its name, else under its node id. Earlier entries stay.</dd>
                <dt>agent <span class="property-type">object</span></dt><dd><code>{ runId, sessionId, model, turns, durationMs, tokens, weighted, usage }</code>. <code>weighted</code> is the price-weighted total in sonnet input tokens (see the README). Put <code>sessionId</code> into <code>msg.agent.resume</code> to continue the session.</dd>
            </dl>
        </li>
        <li>Question
            <dl class="message-properties">
                <dt>payload <span class="property-type">object</span></dt><dd><code>{ question, options }</code> from <code>ask_operator</code>.</dd>
            </dl>
        </li>
        <li>Events
            <dl class="message-properties">
                <dt>payload <span class="property-type">object</span></dt><dd><code>{ runId, seq, time, kind, text }</code>. The node cuts <code>text</code> after 300 characters. A <code>prompt</code> event from the inbox has the message text only (no label line), <code>source: 'agent'</code> and <code>from</code>. The <code>sent</code> event of the <code>send</code> tool has <code>to</code>. One from a keep-alive or close turn has <code>source: 'life'</code>.</dd>
            </dl>
        </li>
    </ol>

    <h3>Details</h3>
    <p>Each run has the tool <code>ask_operator(question, options)</code>. The run waits for an answer from output 2, from a control message, or from the popup.</p>
    <p>A run waits for its background tasks, subagents and shell jobs. It ends with the first result that comes when no background task works.</p>
    <p>A failed run goes to a <code>catch</code> node. <code>msg.agent.reason</code> is one of <code>max_turns</code>, <code>max_cost</code>, <code>timeout</code>, <code>schema</code>, <code>sdk_error</code> or <code>node_closed</code>.</p>
    <p>Click the node to open the popup. The top of the popup shows the name of the node (or claude-agent), its summary (when set) and a line with its model, folder and sandbox. The model is the true model of the selected run, for example <code>opus 5.5</code>. With no run, it is the model of the last run. A model of the node with another family shows after it, for example <code>opus 5.5 (node: sonnet)</code>. The folder and the sandbox are the settings of the node, not the msg.cwd of a run. Drag the empty part of the tab row to move the popup. The two tabs are below it. Chat shows the text of the operator on the right and the text of the agent on the left. Timeline shows all events. The status line shows the state, the turns, the tokens used and the context size of the last model response.</p>
    <p>The timer chip in the header shows <b>Active</b>, the time since the selected run started, and <b>Cache</b>, the minutes until the prompt cache expires, for example <code>Cache 52m</code>. The cache countdown starts again at each model response. It is an estimate. <code>Cache cold</code> means that the next message reads the full context again at the full price. The chip turns amber at 5 minutes or less.</p>
    <p><b>New chat</b> (the + button) makes the node forget its last session and clears the popup log. The next message from the popup starts a new session. It is not possible while a run is active.</p>
    <p>The message box is at the bottom. Enter sends; Shift+Enter starts a new line. When no run is active, Send starts a run with your text as the task; the run continues the last session of the node. When the agent asks a question, the popup shows it with one button for each option, and Send becomes Answer. Interrupt and Stop show only while a run is active.</p>
    <p>A deploy of the node ends its live runs and clears the popup log.</p>

    <h3>Session mode agent</h3>
    <p>The node runs one turn at a time and keeps one session. A message that arrives during a turn waits. At the turn end, all waiting messages go in as one prompt, and each gets one output.</p>
    <p>After a turn, a timer runs: the cache time minus 1 minute. Each model response starts it again. At the timer end, the node closes the session: it asks the agent for a note of 200 words maximum, stores the answer, and forgets the session. An empty answer gives no note. If a <code>send</code> has no answer yet, the node sends a keep-alive turn (prompt <code>.</code>) in place of the close, up to <b>Max keep-alive</b> times.</p>
    <p>A context above <b>Context limit</b> at a turn end also closes the session. In a long turn, the node tells the agent to call the tool <code>handoff(note)</code>. The node then stores the note and continues the task in a new session. The input message gets its output from the new session.</p>
    <p>A new session starts with the note and then deletes it. The note is the file <code>&lt;userDir&gt;/claude-agent/&lt;node id&gt;.note.md</code>. Stop keeps the session, and the timer runs.</p>
    <p>The node keeps the id of the last session in the file <code>&lt;userDir&gt;/claude-agent/&lt;node id&gt;.session</code>. A deploy and a restart do not delete it. A close turn and New chat delete it. A new session with no note, and with this file (the last session had no close turn), starts with a text that tells the agent to read the record of its last session (<code>~/.claude/projects/*/&lt;id&gt;.jsonl</code>). The agent reads it, not the node.</p>
    <p>Keep-alive and close turns send nothing on the outputs. The popup shows them as <i>life cycle</i> lines.</p>

    <h3>MQTT inbox</h3>
    <p>The popup shows the text of the agent as markdown: headings, lists, tables, code, links and emphasis. A link opens in a new tab. An image or other remote file does not show. The text of the operator and of a question stays plain text. The Agents tab shows an inbox message as a closed card on the left (the sender, the time and the first 3 lines) and a message that the agent sent with <code>send</code> as a card on the right (the receiver, the time and the first 3 lines). A click on a longer card opens the full text in the card, and a second click closes it. The badge of the tab counts the received messages that came while it was not shown. The Chat tab shows none of them. The Timeline tab shows the full text too. A keep-alive turn has no bubble: the life cycle line shows it.</p>
    <p>The address of the agent is <code>&lt;team&gt;/&lt;name&gt;</code>: the tab label and the node name. <code>/ + #</code> and white space become <code>-</code>. A node with no name gets no inbox.</p>
    <p>The inbox topic is <code>agents/&lt;team&gt;/agent/&lt;name&gt;/inbox</code> (QoS 1). The payload is JSON <code>{ "from": "&lt;team&gt;/&lt;name&gt;", "text": "..." }</code>. Other payloads give a warning. An inbox message starts a turn in both session modes. Its result goes out on output 1 as a new msg.</p>
    <p>The agent gets the tool <code>send(to, text)</code>. <code>to</code> is <code>name</code> (same team) or <code>team/name</code>. With no broker connection, the tool gives an error text. A send that has no answer yet keeps the session open with keep-alive turns. With <code>report: true</code> the text is a report that expects no answer: the send opens no item and causes no keep-alive turn.</p>
</script>
