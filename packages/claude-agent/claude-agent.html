<script type="text/javascript">
(function () {
    const NODE_COLOR = '#9fd8d0';
    const activeRuns = {};      // nodeId to the active runs of the runtime node
    const lastEnd = {};         // nodeId to the end of the last run: the result line, "stopped" or the error
    const views = {};           // view key to the tab: 'chat' (the default), 'agents' or 'timeline'. Survives a rebuild. The key is the node id for the popup and 'side' for the sidebar panel.
    const sessions = {};        // nodeId to the last session of the runtime node: { cacheTtl, lastActivity, model }
    const unread = {};          // view key to the count of agent messages that came while the Agents tab was not shown
    const pasted = {};          // nodeId to the files in the message box that are not sent: pictures { mediaType, data } and documents { name, mediaType, data }. Survives a popup rebuild.
    let chipTimer = null;       // one timer for the chips of all views
    const OPERATOR_KINDS = ['prompt', 'message', 'answer'];
    const AGENT_KINDS = ['text', 'question'];
    const END_KINDS = ['result', 'error'];
    const MAX_ENTRIES = 200;
    const IMAGE_TYPES = ['image/png', 'image/jpeg', 'image/gif', 'image/webp'];
    const MAX_FILES = 5;
    const MAX_BYTES = 3 * 1024 * 1024;   // the editor sends a message in an HTTP request, and Node-RED refuses a request above 5 MB
    const MAX_TEXT_BYTES = 1024 * 1024;
    const TEXT_EXTENSIONS = /\.(txt|md|markdown|csv|tsv|json|jsonl|ya?ml|toml|xml|html?|css|js|mjs|ts|py|sh|c|h|cpp|java|go|rs|sql|log|ini|conf)$/i;

    // The look of the popup. It uses the theme variables of Node-RED, so it follows the light and the dark theme.
    // The operator bubble has the node colour with dark text: that has contrast in both themes.
    const STYLE = `
.ca-popup{position:relative;display:flex;flex-direction:column;gap:6px;height:100%;min-height:0;min-width:0;font-size:12px;color:var(--red-ui-primary-text-color);cursor:default;user-select:text;outline:none}

.ca-name,.ca-summary,.ca-about,.ca-chip,.ca-meta,.ca-empty,.ca-working,.ca-bubble,.ca-inbox,.ca-inbox-text,.ca-log{cursor:text}

.ca-identity{flex:none;display:flex;flex-direction:column;min-width:0;padding:0 2px 2px}

.ca-chip{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;font-variant-numeric:tabular-nums;padding:1px 7px;border-radius:10px;border:1px solid var(--red-ui-secondary-border-color);background:var(--red-ui-tertiary-background);color:var(--red-ui-secondary-text-color)}

.ca-inbox{flex:none;min-height:44px;box-sizing:border-box;max-width:85%;padding:4px 10px 6px;border-radius:6px;border:1px solid var(--red-ui-secondary-border-color);border-left:3px solid var(--red-ui-secondary-text-color);background:var(--red-ui-secondary-background)}

.ca-inbox.ca-more,.ca-inbox.ca-open{cursor:pointer}
.ca-inbox:focus-visible{outline:1px solid var(--red-ui-form-input-focus-color)}
.ca-inbox .ca-meta{display:flex;align-items:center;gap:6px;margin:0 0 2px;font-size:11px;font-weight:600;color:var(--red-ui-secondary-text-color)}

.ca-inbox.ca-open .ca-meta i{transform:rotate(180deg)}

.ca-doc{position:relative;flex:none;display:flex;flex-direction:column;justify-content:center;box-sizing:border-box;height:64px;max-width:160px;padding:6px 8px;border:1px solid var(--red-ui-secondary-border-color);border-radius:4px;background:var(--red-ui-primary-background);font-size:12px}

.ca-pics{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:4px;max-width:100%;margin-bottom:2px}
.ca-pics img{display:block;max-height:120px;max-width:100%;border-radius:8px;border:1px solid var(--red-ui-secondary-border-color);cursor:zoom-in}
.ca-side-body{position:absolute;inset:0;padding:6px;box-sizing:border-box}
.ca-side .ca-summary,.ca-side .ca-about{display:none}
.ca-side .ca-spacer{cursor:default}
.ca-side-empty{padding:12px;text-align:center;color:var(--red-ui-secondary-text-color)}
.ca-zoom{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:8px;border-radius:4px;background:rgba(0,0,0,.8);cursor:zoom-out}
.ca-zoom img{max-width:100%;max-height:100%;object-fit:contain}
.ca-footer{display:flex;align-items:center;justify-content:flex-end;gap:4px;min-width:0;padding:2px 4px 4px 8px}
.ca-footer .red-ui-button{flex:none}
`;

    function addStyle() {
        if (document.getElementById('claude-agent-style')) return;
        const style = make('style', STYLE);
        style.id = 'claude-agent-style';
        document.head.appendChild(style);
    }

    function make(tag, text, className) {
        const e = document.createElement(tag);
        if (text) e.textContent = text;
        if (className) e.className = className;
        return e;
    }

    // A small button of Node-RED with an icon, a label and a title
    function button(icon, label, title) {
        const b = make('button', '', 'red-ui-button red-ui-button-small');
        b.type = 'button';
        if (label) b.setAttribute('aria-label', label);
        if (icon) b.appendChild(make('i', '', 'fa ' + icon));
        if (label) b.appendChild(make('span', (icon ? ' ' : '') + label));
        if (title) b.title = title;
        return b;
    }

    // A node has up to two views at the same time: the popup and the panel of the sidebar. Each view has a root element.
    function roots(node) {
        return Array.from(document.querySelectorAll('.ca-popup[data-node="' + node.id + '"]'));
    }

    // Run fn(node, root, ...args) for each view of the node
    function each(node, fn, ...args) {
        for (const root of roots(node)) fn(node, root, ...args);
    }

    // An element of a view: identity, name, summary, about, log, chat, list, empty, working, ask, run, chip, new, text, send, interrupt or stop
    function part(root, name) {
        return root.querySelector('[data-ca="' + name + '"]');
    }

    // The model of the selected run as family and version, for example "opus 5.5". An ID of another format shows in full.
    // With no run, it is the model of the last run. With no run since the start, it is the model of the node.
    // A node model of a different family shows after it, for example "opus 5.5 (node: sonnet)".
    function modelText(node, root) {
        const run = selectedRun(node, root);
        const session = sessions[node.id];
        const id = (run && run.model) || (session && session.model);
        if (!id) return node.model || 'default model';
        const found = /claude-([a-z]+)-(\d+)-(\d{1,2})(?!\d)/.exec(id);
        const text = found ? found[1] + ' ' + found[2] + '.' + found[3] : id;
        return node.model && !(found && found[1] === node.model) ? text + ' (node: ' + node.model + ')' : text;
    }

    // Show the name of the node and its settings at the top of the popup. The text is set with textContent only.
    function showIdentity(node, root) {
        const identity = part(root, 'identity');
        if (!identity) return;
        const about = [modelText(node, root), node.cwd || 'work root'];
        if (node.sandbox) about.push('sandbox ' + node.sandbox);
        const summary = String(node.summary || '').trim();
        for (const [name, text] of [['name', node.name || 'claude-agent'], ['summary', summary], ['about', about.join(' · ')]]) {
            const line = part(root, name);
            // A line with the same text stays as it is, so a selection in it stays
            if (line.textContent !== text) line.textContent = text;
            line.title = text;
        }
        part(root, 'summary').style.display = summary ? '' : 'none';
    }

    const pad = (n) => String(n).padStart(2, '0');
    const clock = (time) => { const d = new Date(time); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };

    function selectedRun(node, root) {
        const runs = activeRuns[node.id] || [];
        const select = part(root, 'run');
        return runs.find((r) => select && r.runId === select.value) || runs[0];
    }

    // Show the selected run in the status line, the question block, the working line and the buttons.
    function showRun(node, root) {
        showIdentity(node, root);
        const run = selectedRun(node, root);
        const status = document.getElementById('nru_popup.' + node.id + '.statusText');
        if (status && root.dataset.key === node.id) {
            status.setStatusText(run ? [run.state, run.turns + (run.turns === 1 ? ' turn' : ' turns'), run.tokens, run.context && 'context ' + run.context].filter(Boolean).join(', ')
                : lastEnd[node.id] || 'no active run');
        }
        const ask = part(root, 'ask');
        if (!ask) return;
        showChip(node, root);
        part(root, 'new').disabled = (activeRuns[node.id] || []).length > 0;
        const working = !!(run && (run.state === 'starting' || run.state === 'running'));
        part(root, 'working').style.display = working ? '' : 'none';
        for (const name of ['interrupt', 'stop']) part(root, name).style.display = run ? '' : 'none';
        const waiting = !!(run && run.state === 'waiting' && run.question);
        ask.textContent = '';
        ask.style.display = waiting ? '' : 'none';
        part(root, 'send-label').textContent = ' ' + (waiting ? 'Answer' : 'Send');
        part(root, 'text').placeholder = waiting ? 'Your answer' : 'Message to the agent';
        if (!waiting) return;
        ask.appendChild(make('div', 'Agent asks: ' + run.question.question));
        for (const option of run.question.options) {
            const b = button('', option);
            b.addEventListener('click', () => sendControl(node, root, 'answer', option));
            ask.appendChild(b);
        }
    }

    function showRuns(node, runs) {
        activeRuns[node.id] = runs;
        each(node, fillRuns, runs);
    }

    function fillRuns(node, root, runs) {
        const select = part(root, 'run');
        const keep = select.value;
        select.textContent = '';
        for (const run of runs) {
            const option = make('option', run.runId);
            option.value = run.runId;
            select.appendChild(option);
        }
        if (runs.some((r) => r.runId === keep)) select.value = keep;
        select.style.display = runs.length > 1 ? '' : 'none';
        showRun(node, root);
    }

    // live is true for an event that comes from the runtime now, false for the log that a view loads when it opens.
    // A log goes to the one view that loads it: root. A live event goes to each view of the node.
    // A chat text is a message of the operator or of the agent. A life cycle prompt is not.
    function addEvent(node, e, live, root) {
        if (e.kind === 'result') lastEnd[node.id] = e.text;
        else if (e.kind === 'error') lastEnd[node.id] = 'error: ' + e.text;
        else if (e.kind === 'state' && e.text === 'stopped') lastEnd[node.id] = 'stopped';
        for (const r of root ? [root] : roots(node)) addEventIn(node, r, e, live);
    }

    function addEventIn(node, root, e, live) {
        const log = part(root, 'log');
        const runId = (activeRuns[node.id] || []).length > 1 ? e.runId + ' ' : '';
        log.appendChild(make('div', new Date(e.time).toLocaleTimeString() + ' ' + runId + e.kind + ': ' + e.text));
        while (log.childNodes.length > MAX_ENTRIES) log.removeChild(log.firstChild);
        log.scrollTop = log.scrollHeight;
        addChat(node, root, e);
        addAgents(node, root, e, live);
    }

    // Agent text is markdown. The HTML passes DOMPurify twice: renderMarkdown returns the raw text when marked fails.
    // DOMPurify drops each tag and attribute that makes the browser load a remote file, so the agent text cannot call a server.
    const PURIFY = {
        FORBID_TAGS: ['img', 'picture', 'source', 'video', 'audio', 'track', 'iframe', 'object', 'embed', 'style', 'link'],
        FORBID_ATTR: ['style', 'poster', 'srcset', 'src']
    };

    // A link opens in a new tab.
    function renderMarkdown(bubble, text) {
        bubble.className += ' ca-md';
        bubble.innerHTML = DOMPurify.sanitize(RED.utils.renderMarkdown(text), PURIFY);
        bubble.querySelectorAll('a').forEach((a) => {
            a.setAttribute('target', '_blank');
            a.setAttribute('rel', 'noopener noreferrer');
        });
    }

    // A message of the Agents tab: a closed card with the sender or the receiver, the time and the first 3 lines.
    // A received message is on the left, a sent message on the right.
    // A card with more text than 3 lines gets the class ca-more: an arrow shows, and a click or Enter opens the full text.
    // The next click closes it. A click that ends a text selection in the card does not.
    function inboxCard(e) {
        const sent = e.kind === 'sent';
        const card = make('div', '', 'ca-msg ca-inbox' + (sent ? ' ca-sent' : ''));
        const meta = make('div', (sent ? 'To ' + e.to : 'From ' + e.from) + ' · ' + clock(e.time), 'ca-meta');
        const text = make('div', e.text, 'ca-inbox-text');
        meta.appendChild(make('i', '', 'fa fa-angle-down'));
        card.appendChild(meta);
        card.appendChild(text);
        const toggle = () => {
            if (!card.classList.contains('ca-more') && !card.classList.contains('ca-open')) return;
            card.setAttribute('aria-expanded', String(card.classList.toggle('ca-open')));
        };
        card.addEventListener('click', () => {
            const s = window.getSelection && window.getSelection();
            if (!s || s.isCollapsed || !card.contains(s.anchorNode)) toggle();
        });
        card.addEventListener('keydown', (k) => {
            if (k.target !== card || (k.key !== 'Enter' && k.key !== ' ')) return;
            k.preventDefault();
            toggle();
        });
        // The measure runs at the first layout, at a resize of the popup and when the hidden tab shows.
        if (typeof ResizeObserver === 'function') {
            new ResizeObserver(() => {
                if (card.classList.contains('ca-open')) return;
                const more = text.scrollHeight > text.clientHeight + 1;
                card.classList.toggle('ca-more', more);
                if (more) {
                    card.tabIndex = 0;
                    card.setAttribute('role', 'button');
                    card.setAttribute('aria-expanded', 'false');
                } else {
                    card.removeAttribute('tabindex');
                    card.removeAttribute('role');
                    card.removeAttribute('aria-expanded');
                }
            }).observe(text);
        }
        return card;
    }

    // A picture as a data URL. A picture of another type gives no URL.
    function imageUrl(image) {
        return image && IMAGE_TYPES.includes(image.mediaType) ? 'data:' + image.mediaType + ';base64,' + image.data : '';
    }

    // The pictures of an operator message in the paste order. A click opens a picture large over the popup.
    function pictures(node, root, images) {
        const row = make('div', '', 'ca-pics');
        for (const image of images) {
            const url = imageUrl(image);
            if (!url) continue;
            const img = make('img');
            img.src = url;
            img.alt = 'Picture';
            img.addEventListener('click', () => zoom(root, url));
            row.appendChild(img);
        }
        return row;
    }

    // A size as "12 KB" or "1.4 MB"
    function sizeText(bytes) {
        return bytes < 1024 * 1024 ? Math.max(1, Math.round(bytes / 1024)) + ' KB' : (bytes / 1024 / 1024).toFixed(1) + ' MB';
    }

    // The chip of a document: the name and the size
    function docChip(name, bytes) {
        const chip = make('div', '', 'ca-doc');
        const label = make('span', name);
        label.title = name;
        chip.appendChild(label);
        chip.appendChild(make('span', sizeText(bytes)));
        return chip;
    }

    // One picture large over the popup. A click or Escape closes it.
    function zoom(root, url) {
        const overlay = make('div', '', 'ca-zoom');
        overlay.tabIndex = -1;
        const img = make('img');
        img.src = url;
        img.alt = 'Picture';
        overlay.appendChild(img);
        overlay.addEventListener('click', () => overlay.remove());
        overlay.addEventListener('keydown', (k) => { if (k.key === 'Escape') overlay.remove(); });
        root.appendChild(overlay);
        overlay.focus();
    }

    // The row of pasted files above the text of the message box: the pictures, then the documents. Each one has an x that removes it.
    function showPasted(node) {
        each(node, showPastedIn);
    }

    function showPastedIn(node, root) {
        const row = part(root, 'shots');
        row.textContent = '';
        const files = pasted[node.id] || [];
        row.style.display = files.length ? '' : 'none';
        const removeButton = (file) => {
            const remove = make('button', '×');
            remove.type = 'button';
            remove.title = 'Remove';
            remove.addEventListener('click', () => {
                files.splice(files.indexOf(file), 1);
                showPasted(node);
                part(root, 'text').focus();
            });
            return remove;
        };
        files.filter((f) => !f.name).forEach((image, i) => {
            const shot = make('div', '', 'ca-shot');
            const img = make('img');
            img.src = imageUrl(image);
            img.alt = 'Picture ' + (i + 1);
            shot.appendChild(img);
            shot.appendChild(removeButton(image));
            row.appendChild(shot);
        });
        files.filter((f) => f.name).forEach((doc) => {
            const chip = docChip(doc.name, doc.data.length * 0.75);
            chip.appendChild(removeButton(doc));
            row.appendChild(chip);
        });
    }

    // The type of a pasted document: 'application/pdf' or 'text/plain', or '' for a file that the node does not take
    function documentType(file) {
        if (file.type === 'application/pdf' || /\.pdf$/i.test(file.name)) return 'application/pdf';
        if (file.type.startsWith('text/') || /\/(json|xml|x-yaml|yaml|javascript)$/.test(file.type) || TEXT_EXTENSIONS.test(file.name)) return 'text/plain';
        return '';
    }

    function base64Of(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(String(reader.result).replace(/^data:[^,]*,/, ''));
            reader.onerror = () => reject(reader.error);
            reader.readAsDataURL(file);
        });
    }

    // Ctrl+V of files adds them to the message box: a picture, a PDF or a text file. A paste of text stays as it is.
    async function pasteFiles(node, e) {
        const files = Array.from((e.clipboardData && e.clipboardData.items) || [])
            .filter((item) => item.kind === 'file').map((item) => item.getAsFile()).filter(Boolean);
        if (!files.length) return;
        // Text with formatting next to a file is a copy from a word processor, a spreadsheet or a web page: the file is a picture of the text.
        // The text goes to the box as in each text box. A file manager gives a path as text, but no formatting.
        if (e.clipboardData.types.includes('text/html') && e.clipboardData.getData('text/plain')) return;
        e.preventDefault();
        e.stopPropagation();
        for (const file of files) {
            let item;
            try {
                if (IMAGE_TYPES.includes(file.type)) {
                    item = await shrink(file);
                } else {
                    const mediaType = documentType(file);
                    if (!file.size) { RED.notify(file.name + ': the file is empty.', 'warning'); continue; }
                    if (!mediaType) { RED.notify(file.name + ': this file type is not supported.', 'warning'); continue; }
                    const max = mediaType === 'application/pdf' ? MAX_BYTES : MAX_TEXT_BYTES;
                    if (file.size > max) { RED.notify(file.name + ': the file is too large (max ' + max / 1024 / 1024 + ' MB).', 'warning'); continue; }
                    item = { name: file.name, mediaType, data: await base64Of(file) };
                }
            } catch (err) {
                RED.notify(file.name + ': the file cannot be read.', 'warning');
                continue;
            }
            // Read the list after the wait: a Send or another paste can change it meanwhile.
            const list = pasted[node.id] = pasted[node.id] || [];
            if (list.length >= MAX_FILES) return RED.notify('Maximum ' + MAX_FILES + ' files.', 'warning');
            if (list.reduce((sum, f) => sum + f.data.length * 0.75, 0) + item.data.length * 0.75 > MAX_BYTES) {
                RED.notify('Maximum 3 MB in total.', 'warning');
                continue;
            }
            list.push(item);
            showPasted(node);
        }
    }

    // A pasted picture as { mediaType, data }. The long side becomes 1568 px at most: the model makes a larger picture
    // smaller before it reads it. A PNG above 1 MB becomes a JPEG, so a normal screenshot fits in the 3 MB of a message.
    async function shrink(file) {
        const url = URL.createObjectURL(file);
        try {
            const img = new Image();
            img.src = url;
            await img.decode();
            const scale = Math.min(1, 1568 / Math.max(img.naturalWidth, img.naturalHeight));
            const canvas = make('canvas');
            canvas.width = Math.round(img.naturalWidth * scale);
            canvas.height = Math.round(img.naturalHeight * scale);
            const context = canvas.getContext('2d');
            context.fillStyle = '#fff';
            context.fillRect(0, 0, canvas.width, canvas.height);
            context.drawImage(img, 0, 0, canvas.width, canvas.height);
            let mediaType = 'image/png';
            let data = canvas.toDataURL(mediaType);
            if (data.length * 0.75 > 1024 * 1024) data = canvas.toDataURL(mediaType = 'image/jpeg', 0.85);
            return { mediaType, data: data.replace(/^data:[^,]*,/, '') };
        } finally {
            URL.revokeObjectURL(url);
        }
    }

    // The chat tab: operator bubbles on the right, agent bubbles on the left, the end of a run as a pill
    function addChat(node, root, e) {
        const list = part(root, 'list');
        let entry;
        // A keep-alive or close prompt is not text of the operator: the life cycle pill shows it.
        if (e.kind === 'prompt' && e.source === 'life') return;
        if (e.kind === 'prompt' && e.source === 'agent') return;
        if (OPERATOR_KINDS.includes(e.kind) || AGENT_KINDS.includes(e.kind)) {
            const operator = OPERATOR_KINDS.includes(e.kind);
            const runId = (activeRuns[node.id] || []).length > 1 && !operator ? ' ' + e.runId : '';
            entry = make('div', '', 'ca-msg ' + (operator ? 'ca-op' : 'ca-agent') + (e.kind === 'question' ? ' ca-question' : ''));
            entry.appendChild(make('div', (operator ? 'You' : 'Agent' + runId) + ' · ' + clock(e.time), 'ca-meta'));
            if (operator && Array.isArray(e.images) && e.images.length) entry.appendChild(pictures(node, root, e.images));
            if (operator && Array.isArray(e.documents) && e.documents.length) {
                const docs = make('div', '', 'ca-docs');
                for (const d of e.documents) docs.appendChild(docChip(d.name, d.size));
                entry.appendChild(docs);
            }
            const bubble = make('div', e.kind === 'question' ? 'Question: ' + e.text : operator ? e.text : '', 'ca-bubble');
            if (e.kind === 'text') renderMarkdown(bubble, e.text);
            if (!operator || e.text) entry.appendChild(bubble);
        } else if (e.kind === 'artifact' && e.artifact) {
            entry = window.caFiles.chatLine(e, (id, n) => {
                showView(root, 'files');
                openFile(node, root, id, n);
            });
        } else if (e.kind === 'life') {
            // A keep-alive, a close, a note or a handoff of the session mode agent
            entry = make('div', 'life cycle: ' + e.text, 'ca-end ca-life');
        } else if (END_KINDS.includes(e.kind) || (e.kind === 'state' && e.text === 'stopped')) {
            entry = make('div', e.kind === 'error' ? 'error: ' + e.text : e.text, 'ca-end' + (e.kind === 'error' ? ' ca-error' : ''));
        } else return;
        list.appendChild(entry);
        while (list.childNodes.length > MAX_ENTRIES) list.removeChild(list.firstChild);
        part(root, 'empty').style.display = 'none';
        const chat = part(root, 'chat');
        chat.scrollTop = chat.scrollHeight;
    }

    // The Agents tab: the messages that the agent got from other agents and the messages that it sent, oldest at the top.
    // A live received message that comes while the tab is not shown adds to the badge of the tab. A sent message does not.
    function addAgents(node, root, e, live) {
        const list = part(root, 'agents');
        if (!((e.kind === 'prompt' && e.source === 'agent') || e.kind === 'sent')) return;
        list.appendChild(inboxCard(e));
        while (list.childNodes.length > MAX_ENTRIES) list.removeChild(list.firstChild);
        if (views[root.dataset.key] === 'agents') list.scrollTop = list.scrollHeight;
        else if (live && e.kind === 'prompt') showBadge(root, (unread[root.dataset.key] || 0) + 1);
    }

    // The badge after the label of the Agents tab: hidden at 0, "99+" above 99
    function showBadge(root, count) {
        unread[root.dataset.key] = count;
        const badge = part(root, 'badge');
        badge.textContent = count > 99 ? '99+' : String(count);
        badge.style.display = count ? '' : 'none';
    }

    // The Files tab builds its list at the first show
    function fileView(node, root) {
        const pane = part(root, 'files');
        if (!root.caFiles) {
            root.caFiles = window.caFiles.build({ nodeId: node.id });
            pane.appendChild(root.caFiles.root);
        }
        return root.caFiles;
    }

    function openFile(node, root, id, n) {
        fileView(node, root).open(id, n);
    }

    // Show one tab of a view
    function showView(root, view) {
        views[root.dataset.key] = view;
        const panes = { chat: part(root, 'chat'), agents: part(root, 'agents'), timeline: part(root, 'log'), files: part(root, 'files') };
        for (const [name, pane] of Object.entries(panes)) {
            pane.style.display = name !== view ? 'none' : name === 'timeline' ? '' : 'flex';
            part(root, 'tab-' + name).classList.toggle('selected', name === view);
        }
        if (view === 'agents') showBadge(root, 0);
        if (view === 'files') {
            fileView(root.caNode, root);
            window.caFiles.seenNode(root.dataset.node);
        }
        panes[view].scrollTop = panes[view].scrollHeight;
    }

    function sendControl(node, root, cmd, text, images, documents) {
        const run = selectedRun(node, root);
        if (!run && cmd !== 'message') return RED.notify('No active run', 'warning');
        const request = run ? node.nodeRedEditorComms.publish('control', { cmd: cmd, runId: run.runId, text: text, images: images, documents: documents })
            : node.nodeRedEditorComms.publish('start', { text: text, images: images, documents: documents });
        request
            .then((res) => { if (res && res.error) RED.notify(res.error, 'warning'); })
            .catch((err) => RED.notify(err.status === 404 ? 'Deploy the node first' : err.message, 'warning'));
    }

    // The text of the timer chip. Active: the time since the start of the selected run.
    // Cache: the minutes until the prompt cache expires. Each model response restarts the cache time.
    function chipState(node, run, now) {
        const session = sessions[node.id] || { cacheTtl: node.cacheTtl === '5m' ? '5m' : '1h', lastActivity: null };
        const ttlMin = session.cacheTtl === '5m' ? 5 : 60;
        const since = run ? run.lastActivity : session.lastActivity;
        const info = 'Cache: the estimated time until the ' + ttlMin + '-minute prompt cache expires. Each model response starts it again.';
        let cache = 'Cache --';
        let title = info;
        let warn = false;
        if (typeof since === 'number') {
            const left = since + ttlMin * 60000 - now;
            warn = left <= 5 * 60000;
            if (left > 0) {
                cache = 'Cache ' + pad(Math.ceil(left / 60000)) + 'm';
            } else {
                cache = 'Cache cold';
                title = 'The prompt cache has expired. The next message reads the full context again at the full price.';
            }
        } else if (!run) {
            return { text: 'New chat', title: 'The next message starts a new session.', warn: false };
        }
        if (!run) return { text: cache, title: title, warn: warn };
        const min = Math.max(0, Math.floor((now - run.startTime) / 60000));
        const active = min >= 60 ? Math.floor(min / 60) + 'h ' + pad(min % 60) + 'm' : min + 'm';
        return { text: 'Active ' + active + ' · ' + cache, title: 'Active: the time since the run started.\n' + title, warn: warn };
    }

    function showChip(node, root) {
        const chip = part(root, 'chip');
        const state = chipState(node, selectedRun(node, root), Date.now());
        chip.textContent = state.text;
        chip.title = state.title;
        chip.classList.toggle('ca-warn', state.warn);
    }

    // Update the chips of all views every 10 s. The timer stops when no view is in the page.
    function startChipTimer() {
        if (chipTimer) return;
        chipTimer = setInterval(() => {
            const all = Array.from(document.querySelectorAll('.ca-popup')).filter((root) => root.isConnected && root.caNode);
            for (const root of all) showChip(root.caNode, root);
            if (!all.length) {
                clearInterval(chipTimer);
                chipTimer = null;
            }
        }, 10000);
    }

    // New chat: the runtime forgets the last session and clears the popup log
    function newChat(node, root) {
        node.nodeRedEditorComms.publish('new-chat')
            .then((res) => { if (res && res.error) RED.notify(res.error, 'warning'); })
            .catch((err) => RED.notify(err.status === 404 ? 'Deploy the node first' : err.message, 'warning'));
        part(root, 'text').focus();
    }

    // The runtime has cleared its log: empty the chat and the Timeline
    function clear(node) {
        delete lastEnd[node.id];
        each(node, (n, root) => {
            showBadge(root, 0);
            for (const name of ['list', 'agents', 'log']) part(root, name).textContent = '';
            part(root, 'empty').style.display = '';
            showRun(n, root);
        });
    }

    // The message box grows with its text, up to about 6 lines. Then it scrolls.
    function grow(text) {
        text.style.height = 'auto';
        if (text.scrollHeight) text.style.height = text.scrollHeight + 'px';
    }

    // Build one element of a view. The popup gives it the id claude-agent-<name>-<nodeId> after the build.
    function element(tag, name, className, text) {
        const e = make(tag, text, className);
        e.dataset.ca = name;
        return e;
    }

    // An open view shows the new name and settings when the edit dialog closes
    if (RED.events) RED.events.on('nodes:change', (n) => { if (n) each(n, showIdentity); });

    // The start of a system prompt as one short line: the first sentence of the first line, without markdown marks.
    // It has at most 120 characters. The editor button uses it. The popup never reads the system prompt.
    const SUMMARY_MAX = 120;
    function summaryFromPrompt(text) {
        let line = '';
        for (const l of String(text || '').split(/\r?\n/)) {
            const t = l.trim().replace(/^(?:[#>\-*+]+|\d+\.)(?:\s+|$)/, '').replace(/\*\*|__|`/g, '').replace(/\s+/g, ' ').trim();
            // A line of only marks, like --- or ###, has no text: skip it
            if (/[\p{L}\p{N}]/u.test(t)) { line = t; break; }
        }
        if (!line) return '';
        const end = line.search(/[.!?](?:\s|$)/);
        if (end >= 0) line = line.slice(0, end + 1);
        if (line.length <= SUMMARY_MAX) return line;
        const limit = SUMMARY_MAX - 3;
        let cut = line.slice(0, limit);
        if (line[limit] !== ' ' && cut.includes(' ')) cut = cut.slice(0, cut.lastIndexOf(' '));
        return cut.trimEnd() + '\u2026';
    }

    // Keep mouse, key and wheel events in the view. If they reach the node, Node-RED gives the focus to the canvas,
    // and the text box gets no keys.
    function keepEvents(div) {
        if (div.claudeAgentEventsKept) return;
        div.claudeAgentEventsKept = true;
        for (const type of ['mousedown', 'mouseup', 'click', 'dblclick', 'touchstart', 'touchend', 'keydown', 'keyup', 'keypress', 'wheel', 'contextmenu']) {
            div.addEventListener(type, (e) => e.stopPropagation());
        }
    }

    // Build the view of a node in div: the popup (key is the node id) or the sidebar panel (key is 'side').
    // Each view has its own root, tab and run choice. The runtime events go to each view of the node.
    function buildView(node, div, key) {
        if (!div) return;
            div.textContent = '';
            keepEvents(div);
            addStyle();
            const root = make('div', '', 'ca-popup');
            root.dataset.node = node.id;
            root.dataset.key = key;
            root.caNode = node;
            if (key !== node.id) root.classList.add('ca-side');
            // A click in the popup gives the focus to the popup. Without it the keys go to the canvas, and Node-RED cancels Ctrl+C.
            root.tabIndex = -1;

            const identity = element('div', 'identity', 'ca-identity');
            identity.appendChild(element('div', 'name', 'ca-name'));
            identity.appendChild(element('div', 'summary', 'ca-summary'));
            identity.appendChild(element('div', 'about', 'ca-about'));

            const header = make('div', '', 'ca-header');
            for (const [view, label] of [['chat', 'Chat'], ['agents', 'Agents'], ['timeline', 'Timeline'], ['files', 'Files']]) {
                const tab = element('button', 'tab-' + view, 'ca-tab', label);
                tab.type = 'button';
                tab.addEventListener('click', () => showView(root, view));
                if (view === 'agents') {
                    const badge = element('span', 'badge', 'ca-badge');
                    badge.style.display = 'none';
                    tab.appendChild(badge);
                }
                header.appendChild(tab);
            }
            // The empty part of the tab row moves the popup: it gives the mouse press to the title bar of the frame
            const spacer = make('div', '', 'ca-spacer');
            if (key === node.id) spacer.addEventListener('mousedown', (e) => {
                const bar = document.getElementById('nru_popup.' + node.id + '.header');
                if (!bar) return;
                e.preventDefault();
                bar.dispatchEvent(new MouseEvent('mousedown', { clientX: e.clientX, clientY: e.clientY, bubbles: true, cancelable: true }));
            });
            header.appendChild(spacer);
            const select = element('select', 'run');
            select.title = 'The active run that the popup shows';
            select.style.display = 'none';
            select.addEventListener('change', () => showRun(node, root));
            const chip = element('span', 'chip', 'ca-chip');
            const fresh = button('fa-plus', '', 'New chat: the next message starts a new session. Stop the active run first.');
            fresh.dataset.ca = 'new';
            fresh.addEventListener('click', () => newChat(node, root));
            for (const e of [select, chip, fresh]) header.appendChild(e);

            const log = element('div', 'log', 'ca-log');
            const agents = element('div', 'agents', 'ca-agents');
            const filesPane = element('div', 'files', 'ca-files');
            const chat = element('div', 'chat', 'ca-chat');
            chat.appendChild(element('div', 'empty', 'ca-empty', 'Ask the agent a question below.'));
            chat.appendChild(element('div', 'list', 'ca-list'));
            const working = element('div', 'working', 'ca-working');
            working.appendChild(make('i', '', 'fa fa-circle-o-notch fa-spin'));
            working.appendChild(make('span', ' Agent is working…'));
            working.style.display = 'none';
            chat.appendChild(working);
            const ask = element('div', 'ask', 'ca-ask');
            ask.style.display = 'none';

            const composer = make('div', '', 'ca-composer');
            const text = element('textarea', 'text');
            text.rows = 1;
            text.placeholder = 'Message to the agent';
            text.addEventListener('input', () => setDraft(node, root, text.value));
            text.addEventListener('paste', (e) => pasteFiles(node, e));
            const shots = element('div', 'shots', 'ca-shots');
            const footer = make('div', '', 'ca-footer');
            const interrupt = button('fa-pause', 'Interrupt', 'Stop the current turn. The run stays open for a new message.');
            interrupt.dataset.ca = 'interrupt';
            const stop = button('fa-stop', 'Stop', 'End the run');
            stop.dataset.ca = 'stop';
            const send = button('fa-paper-plane', '', 'Send the message');
            send.dataset.ca = 'send';
            send.className += ' primary';
            send.appendChild(element('span', 'send-label', '', ' Send'));
            send.addEventListener('click', () => {
                const run = selectedRun(node, root);
                // An answer takes no files: they stay in the message box for the next message.
                const answer = run && run.state === 'waiting';
                const files = answer ? [] : pasted[node.id] || [];
                const images = files.filter((f) => !f.name);
                const documents = files.filter((f) => f.name);
                sendControl(node, root, answer ? 'answer' : 'message', text.value, images.length ? images : undefined, documents.length ? documents : undefined);
                setDraft(node, null, '');
                if (!answer) delete pasted[node.id];
                showPasted(node);
            });
            // Enter sends. Shift+Enter starts a new line. Enter that ends an IME composition does not send.
            text.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
                    e.preventDefault();
                    send.click();
                }
            });
            interrupt.addEventListener('click', () => sendControl(node, root, 'interrupt'));
            stop.addEventListener('click', () => sendControl(node, root, 'stop'));
            for (const e of [interrupt, stop, send]) footer.appendChild(e);
            composer.appendChild(shots);
            composer.appendChild(text);
            composer.appendChild(footer);

            for (const e of [identity, header, log, agents, filesPane, chat, ask, composer]) root.appendChild(e);
            div.appendChild(root);
            // The popup keeps the ids that the tests and the scripts of the operator use
            if (key === node.id) for (const e of root.querySelectorAll('[data-ca]')) e.id = 'claude-agent-' + e.dataset.ca + '-' + node.id;
            // A new view starts with the draft of the other view of the node
            const other = roots(node).find((r) => r !== root);
            if (other) setDraft(node, other, part(other, 'text').value, root);
            showPasted(node);
            showView(root, views[key] || 'chat');
            showBadge(root, views[key] === 'agents' ? 0 : unread[key] || 0);
            showRun(node, root);
            startChipTimer();

            node.nodeRedEditorComms.publish('get-log').then((state) => {
                if (state.session) sessions[node.id] = state.session;
                for (const e of state.events) addEvent(node, e, false, root);
                showRuns(node, state.runs);
                // The frame of the popup shows and hides the pane again after the log comes, and each show puts the scroll at the top.
                // Keep the newest message in view each time the pane gets a size, until the user scrolls it.
                const pane = part(root, views[key] === 'agents' ? 'agents' : views[key] === 'timeline' ? 'log' : views[key] === 'files' ? 'files' : 'chat');
                if (!pane || typeof ResizeObserver !== 'function') return;
                const watch = new ResizeObserver(() => {
                    if (pane.clientHeight) pane.scrollTop = pane.scrollHeight;
                });
                const release = () => watch.disconnect();
                for (const type of ['wheel', 'touchstart', 'mousedown', 'keydown']) pane.addEventListener(type, release, { once: true });
                watch.observe(pane);
            }).catch(() => showRuns(node, []));
        }

    // The draft of the message box is the same in each view of the node. source is the view that the user types in: it keeps its text.
    // only: set the draft in this view alone.
    function setDraft(node, source, value, only) {
        for (const root of only ? [only] : roots(node)) {
            const text = part(root, 'text');
            if (root !== source) text.value = value;
            grow(text);
        }
    }

    // The sidebar panel: the chat of the claude-agent node that the operator selected last.
    const side = { body: null, selected: null, shown: null };
    const MENU_LABEL = 'Open popup';
    const EMPTY_TEXT = 'Select a claude-agent node.';

    function showSide() {
        if (!side.body) return;
        const node = side.selected && RED.nodes.node(side.selected);
        if (node && side.shown !== node.id) {
            side.shown = node.id;
            delete views.side;
            delete unread.side;
            buildView(node, side.body, 'side');
        } else if (!node && side.shown !== null) {
            side.shown = null;
            side.body.textContent = '';
            side.body.appendChild(make('div', EMPTY_TEXT, 'ca-side-empty'));
        }
    }

    // The node of the claude-agent that holds an element of the canvas, or null

                }

            mcpServers: {

                validate: function (v) {

                }
            },
            nru_popupConfig: { value: { width: 480, height: 420, autoCloseTime: 0 } }
        },
        inputs: 1,
        outputs: 3,
        outputLabels: ['result', 'question', 'events'],
        icon: 'claude-agent.svg',
        label: function () { return this.name || 'claude-agent'; },
        paletteLabel: 'claude-agent',
        summaryFromPrompt: summaryFromPrompt,

        // A node from before the Cache time property has no value. The dialog shows 60 minutes, as the runtime uses.
        oneditprepare: function () {

            c.setAttribute('r', 8);
            const t = document.createElementNS(ns, 'text');
            t.setAttribute('y', 3);
            t.textContent = n > 99 ? '99+' : String(n);
            badge.appendChild(c);
            badge.appendChild(t);
            g.appendChild(badge);
        }
    }

    // The user opens the Files list of a node: its files up to now are seen
    function seenNode(nodeId) {
        if (!state.loaded) return;
        const seen = stored(SEEN_KEY);
        seen[nodeId] = Math.max(seen[nodeId] || 0, newest(nodeId));
        keep(SEEN_KEY, seen);
        const opened = stored(OPENED_KEY);
        for (const id of Object.keys(opened)) {
            const item = state.items.get(id);
            if (!item || opened[id] <= (seen[item.nodeId] || 0)) delete opened[id];
        }
        keep(OPENED_KEY, opened);
        badges();
    }

    // Equal sort keys give the order of title, then id, so the order is stable
    const byTitle = (a, b) => a.title.localeCompare(b.title) || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0);
    const SORT = {
        time: (a, b) => b.time - a.time || byTitle(a, b),
        size: (a, b) => b.size - a.size || b.time - a.time || byTitle(a, b),
        name: (a, b) => byTitle(a, b) || b.time - a.time
    };

    // Each filter field and the files that it shows
    const TEST = {
        q: (i, f) => {
            const q = f.q.toLowerCase();
            return !q || [i.title, i.name, i.owner, TYPE_NAME[i.type.split('/')[0]]].some((t) => t && t.toLowerCase().includes(q));
        },
        owner: (i, f) => !f.owner || i.owner === f.owner,
        type: (i, f) => !f.type || i.type.split('/')[0] === f.type,
        time: (i, f) => i.time >= ({ today: new Date().setHours(0, 0, 0, 0), 7: Date.now() - 7 * 864e5, 30: Date.now() - 30 * 864e5 }[f.time] || 0)
    };

    // The files to show, with the files in the undo time, sorted by filter.sort
    function visible(opts, filter) {
        let items = [...state.items.values()];
        for (const p of state.pending.values()) if (!state.items.has(p.item.id)) items.push(p.item);
        if (opts.nodeId) items = items.filter((i) => i.nodeId === opts.nodeId);
        if (filter) items = items.filter((i) => Object.values(TEST).every((test) => test(i, filter)));
        return items.sort(SORT[(filter && filter.sort) || 'time']);
    }

    function request(method, url) {
        return $.ajax({ method, url, dataType: 'json' });
    }

    // The id and the version of a file, or null. The id has 16 hex digits and the version is an integer.
    function ref(id, n) {
        return ID.test(id) && /^\d{1,6}$/.test(n) ? { id, n: Number(n) } : null;
    }

    // '#files' gives {}. '#files/<id>/<n>' gives { id, n }. Other text gives null. A bad id or version is dropped.
    function parseHash(hash) {
        const m = /^#files(?:\/([^/]+)\/([^/]+))?$/.exec(hash);
        return m && (ref(m[1], m[2]) || {});
    }

    // The id and the version in a view link or a ticket, or null. The editor decodes the first part and makes no request.
    function ticketRef(text) {
        const m = /(?:\/v\/|^)([A-Za-z0-9_-]+)\.[A-Za-z0-9_-]+(?:[/?#]|$)/.exec(text.trim());
        if (!m) return null;
        try {
            const part = atob(m[1].replace(/-/g, '+').replace(/_/g, '/')).split('|');
            return ref(part[0], part[1]);
        } catch (err) {
            return null;
        }
    }

    // opts: { nodeId } for the files of one node, { all: true } for the sidebar and the page.
    // opts.onChange runs when the open file changes. Gives { root, render, open(id, n), current() }.
    function build(opts) {
        addStyle();
        const root = h('div', 'caf');
        const left = h('div', 'caf-left');
        const list = h('div', 'caf-list');
        const pane = h('div', 'caf-pane');
        const filter = { q: '', owner: '', type: '', time: '', sort: 'time' };
        const cur = { id: null, n: null, compare: null, record: null, auto: false, link: false, scroll: false };
        const view = { root, render, open, end: () => setFull(false), current: () => (cur.id ? { id: cur.id, n: cur.n } : null) };
        let owners = null;
        let types = null;
        let time = null;
        const bar = h('div', 'caf-filters');
        const q = h('input');
        q.type = 'search';
        q.placeholder = 'Search';
        q.addEventListener('input', () => {
            const t = ticketRef(q.value);
            if (t && state.items.has(t.id)) {
                q.value = '';
                open(t.id, t.n);
            }
            filter.q = q.value;
            render();
        });
        bar.appendChild(q);
        left.appendChild(bar);

        if (opts.all) {
            owners = h('select');
            types = h('select');
            time = h('select');
            for (const [v, t] of [['', 'Any time'], ['today', 'Today'], ['7', '7 days'], ['30', '30 days']]) time.appendChild(Object.assign(h('option', '', t), { value: v }));
            owners.addEventListener('change', () => { filter.owner = owners.value; render(); });
            types.addEventListener('change', () => { filter.type = types.value; render(); });
            time.addEventListener('change', () => { filter.time = time.value; render(); });
            const sort = h('select');
            for (const [v, t] of [['time', 'Newest'], ['size', 'Largest'], ['name', 'Name']]) sort.appendChild(Object.assign(h('option', '', t), { value: v }));
            sort.addEventListener('change', () => { filter.sort = sort.value; render(); });
            for (const [e, name] of [[owners, 'Agent'], [types, 'Type'], [time, 'Time'], [sort, 'Sort']]) {
                e.setAttribute('aria-label', name);
                bar.appendChild(e);
            }
        }
        left.appendChild(list);
        const store = opts.all ? h('div', 'caf-store') : null;
        if (store) left.appendChild(store);
        root.appendChild(left);
        root.appendChild(pane);

        // The thumbnail URL of each image entry, by id and version. Empty text: no thumbnail.
        const thumbs = new Map();
        let seen = null;

        // Shows the thumbnail in place of the type icon when the row is on screen. Tickets come on demand.
        async function thumb(icon, item) {
            const key = item.id + '/' + item.version;
            if (!thumbs.has(key)) {
                thumbs.set(key, request('POST', API + '/' + item.id + '/' + item.version + '/ticket').then((t) => t.url + 'thumb', () => ''));
            }
            const src = await thumbs.get(key);
            if (!src || !icon.isConnected) return;
            const img = h('img', 'caf-thumb');
            img.alt = '';
            img.addEventListener('load', () => icon.isConnected && icon.replaceWith(img));
            img.src = src;
        }

        function watch(icon, item) {
            if (!window.IntersectionObserver) return;
            seen = seen || new IntersectionObserver((entries) => {
                for (const e of entries) {
                    if (!e.isIntersecting) continue;
                    seen.unobserve(e.target);
                    e.target.caThumb();
                }
            }, { root: list });
            icon.caThumb = () => thumb(icon, item);
            seen.observe(icon);
        }

        // Fills a filter select and gives the kept value. Before the list loads, the filter keeps its value.
        function fillSelect(select, values, first, keep, name) {
            if (keep && !state.loaded) values = [...values, keep];
            select.textContent = '';
            select.appendChild(Object.assign(h('option', '', first), { value: '' }));
            for (const v of values) select.appendChild(Object.assign(h('option', '', name ? name[v] || v.charAt(0).toUpperCase() + v.slice(1) : v), { value: v }));
            select.value = values.includes(keep) ? keep : '';
            return select.value;
        }

        function row(item) {
            const gone = state.pending.get(item.id);
            const r = h('div', 'caf-row' + (gone ? ' caf-gone' : '') + (item.id === cur.id ? ' caf-on' : ''));
            r.dataset.id = item.id;
            if (gone) {
                r.appendChild(h('span', '', 'Deleted.'));
                const undo = btn('', 'Undo', 'red-ui-button-small');
                undo.addEventListener('click', () => request('POST', API + '/' + item.id + '/restore'));
                r.appendChild(undo);
                return r;
            }
            r.tabIndex = 0;
            r.setAttribute('role', 'button');
            if (isNew(item)) r.appendChild(h('span', 'caf-dot'));
            const line1 = h('div', 'caf-line1');
            const icon = h('i', 'fa ' + iconOf(item.type));
            line1.appendChild(icon);
            if (/^image\//.test(item.type)) watch(icon, item);
            line1.appendChild(h('span', '', item.title));
            if (item.shares) line1.appendChild(h('span', 'caf-chip', 'Shared'));
            r.appendChild(line1);
            r.appendChild(h('div', 'caf-line2', 'Version ' + item.version + ' · ' + stampText(item.time) + ' · ' + sizeText(item.size) + (opts.all ? ' · ' + item.owner : '')));
            const go = () => open(item.id);
            r.addEventListener('click', go);
            r.setAttribute('aria-label', [item.title, TYPE_NAME[item.type.split('/')[0]], item.owner, 'Version ' + item.version, stampText(item.time), 'newest', isNew(item) && 'new'].filter(Boolean).join(', '));
            r.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); }
                const next = e.key === 'ArrowDown' ? r.nextElementSibling : e.key === 'ArrowUp' ? r.previousElementSibling : null;
                if (next && next.tabIndex === 0) { e.preventDefault(); next.focus(); }
            });
            return r;
        }

        function render() {
            const all = visible(opts);
            const searching = opts.all || all.length > SEARCH_MIN;
            bar.style.display = searching ? '' : 'none';
            if (!searching) { filter.q = ''; q.value = ''; }
            const items = visible(opts, filter);
            list.textContent = '';
            if (seen) seen.disconnect();
            seen = null;
            for (const i of items) list.appendChild(row(i));
            if (opts.all) {
                filter.owner = fillSelect(owners, [...new Set(all.map((i) => i.owner))], 'Agent', filter.owner);
                filter.type = fillSelect(types, [...new Set(all.map((i) => i.type.split('/')[0]).filter(Boolean))], 'Type', filter.type, TYPE_NAME);
                time.value = filter.time;
                const noun = (n) => n + (n === 1 ? ' file' : ' files');
                store.textContent = !state.loaded ? '' : (items.length === all.length ? noun(all.length) : items.length + ' of ' + noun(all.length)) + ' · ' + sizeText(state.total);
            }
            const wide = root.clientWidth >= WIDE;
            root.classList.toggle('caf-narrow', !wide);
            root.classList.toggle('caf-open', !!cur.id);
            if (cur.id && state.loaded && !state.items.has(cur.id)) close();
            const on = cur.scroll && list.querySelector('.caf-on');
            if (on) {
                cur.scroll = false;
                on.scrollIntoView({ block: 'nearest' });
            }
        }

        function close() {
            setFull(false);
            cur.id = null;
            cur.record = null;
            pane.textContent = '';
            root.classList.remove('caf-open');
            if (opts.onChange) opts.onChange();
        }

        // The pane of the open file fills the editor window. In the sidebar and on the page it stays in its place, so the frame does not reload.
        // A popup is an SVG foreignObject: it clips a fixed layer and it lies under the editor header. There the pane goes to the body, and the frame loads again.
        const home = document.createComment('caf-pane');
        function onEscape(e) {
            if (e.key !== 'Escape') return;
            e.stopPropagation();
            setFull(false);
        }

        function setFull(on) {
            if (pane.classList.contains('caf-full') === on) return;
            pane.classList.toggle('caf-full', on);
            if (on && pane.closest('foreignObject')) {
                pane.replaceWith(home);
                document.body.appendChild(pane);
            } else if (!on && home.parentNode) {
                home.replaceWith(pane);
            }
            const auto = cur.auto;
            if (!on) cur.auto = false;
            document[on ? 'addEventListener' : 'removeEventListener']('keydown', onEscape, true);
            const target = pane.querySelector(on ? '.caf-closefull' : '.caf-fullbtn');
            if (target) target.focus();
            if (!on && auto) {
                const id = cur.id;
                close();
                const row = list.querySelector('[data-id="' + id + '"]');
                if (row) row.focus();
            }
        }

        // link: the file comes from a hash. The Agent filter shows its owner, and the focus stays where it is.
        async function open(id, n, link) {
            cur.id = id;
            cur.compare = null;
            cur.link = !!link;
            try {
                cur.record = await request('GET', API + '/' + id);
            } catch (err) {
                return close();
            }
            const versions = cur.record.versions.filter((v) => !v.deleted && !v.purged);
            if (!versions.length) return close();
            cur.n = (versions.find((v) => v.n === n) || versions[versions.length - 1]).n;
            const item = state.items.get(id);
            // Each filter that hides the file goes
            const shown = item || itemOf(cur.record);
            if (shown) {
                for (const key of Object.keys(TEST)) if (!TEST[key](shown, filter)) filter[key] = '';
                if (link && owners) filter.owner = shown.owner;
                q.value = filter.q;
            }
            cur.scroll = true;
            if (item) {
                const opened = stored(OPENED_KEY);
                opened[id] = item.time;
                keep(OPENED_KEY, opened);
                badges();
            }
            root.classList.add('caf-open');
            drawPane('start');
            render();
        }

        async function frames(n) {
            try {
                const t = await request('POST', API + '/' + cur.id + '/' + n + '/ticket');
                // A viewer on the origin of the editor could read the editor
                return new URL(t.url, location.href).origin === location.origin ? null : t;
            } catch (err) {
                return null;
            }
        }

        function frame(t, title) {
            const f = h('iframe');
            f.title = title;
            f.src = t.url + '?embed=1&theme=' + themeName();
            f.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-popups allow-downloads');
            // A browser shows a face with no text in a frame that did not connect. The user gets a text.
            fetch(t.url, { mode: 'no-cors' }).catch(() => f.isConnected && f.replaceWith(h('div', 'caf-note', 'The viewer did not answer. The view server is not reachable.')));
            return f;
        }

        // focus: 'start' after open, 'pick' after a version change
        async function drawPane(focus) {
            const record = cur.record;
            const id = cur.id;
            if (opts.onChange) opts.onChange();
            const versions = record.versions.filter((v) => !v.deleted && !v.purged).reverse();
            const item = state.items.get(id) || { title: record.name, version: cur.n, versions: versions.length };
            const v = versions.find((x) => x.n === cur.n) || versions[0];
            pane.textContent = '';
            const head = h('div', 'caf-head');
            const back = btn('fa-chevron-left', 'Files', 'caf-back');
            back.addEventListener('click', () => {
                close();
                const row = list.querySelector('[data-id="' + id + '"]');
                if (row) row.focus();
            });
            const top = h('div', 'caf-top');
            const narrow = root.classList.contains('caf-narrow');
            if (narrow) top.appendChild(back);
            top.appendChild(h('div', 'caf-title', v.title));
            head.appendChild(top);
            const address = item.owner || (record.owner && record.owner.address);
            if (address) top.after(agentLine(address, item.nodeId || (record.owner && record.owner.nodeId), () => setFull(false)));
            const pick = h('select');
            for (const x of versions) {
                pick.appendChild(Object.assign(h('option', '', 'Version ' + x.n + ' · ' + dateText(x.time) + (x === versions[0] ? ' (newest)' : '')), { value: x.n }));
            }
            pick.value = v.n;
            pick.setAttribute('aria-label', 'Version');
            pick.addEventListener('change', () => { cur.n = Number(pick.value); cur.compare = null; drawPane('pick'); });
            head.appendChild(pick);
            const full = btn('fa-expand', 'Full screen', 'caf-fullbtn caf-icon');
            const closeFull = btn('fa-compress', 'Close full screen', 'caf-closefull caf-icon');
            const down = btn('fa-download', 'Download', 'caf-icon');
            const copy = btn('fa-link', 'Copy link', 'caf-icon');
            const tab = btn('fa-external-link', 'Open in new tab', 'caf-icon');
            const compare = btn('fa-columns', 'Compare', 'caf-icon');
            const del = btn('fa-trash-o', 'Delete', 'caf-gap caf-icon');
            for (const e of [full, closeFull, down, copy, tab, compare, del]) head.appendChild(e);
            pane.appendChild(head);
            if (focus === 'start' && !cur.link) (narrow ? back : pick).focus();
            else if (focus === 'pick') pick.focus();

            const body = h('div', 'caf-body');
            pane.appendChild(body);
            if (focus === 'start' && pane.offsetParent && !pane.classList.contains('caf-full') && body.getBoundingClientRect().height < 120) {
                cur.auto = true;
                setFull(true);
            }
            const t = await frames(v.n);
            if (id !== cur.id || v.n !== cur.n) return;
            if (!t) body.appendChild(h('div', 'caf-note', 'This file cannot show here.'));
            else body.appendChild(frame(t, v.title));
            full.addEventListener('click', () => setFull(true));
            closeFull.addEventListener('click', () => setFull(false));
            tab.addEventListener('click', () => t && window.open(t.url + '?theme=' + themeName(), '_blank', 'noopener'));
            down.addEventListener('click', () => {
                if (!t) return;
                const a = h('a');
                a.href = t.download;
                a.click();
            });
            // A new ticket at each click. The link has no embed and no theme.
            copy.addEventListener('click', async () => {
                const link = await frames(v.n);
                if (link && RED.clipboard.copyText(link.url)) RED.notify('Link copied. Anyone with this link can open this version for 12 hours.');
                else RED.notify('The link did not copy.', 'error');
                copy.focus();
            });
            compare.addEventListener('click', () => startCompare(versions, v, body, head));
            del.addEventListener('click', () => confirmDelete(item, record));
        }

        // Side by side on a wide screen, stacked on a narrow screen. The default is the version before.
        async function startCompare(versions, v, body, head) {
            const others = versions.filter((x) => x.n !== v.n);
            if (!others.length) return;
            const before = others.find((x) => x.n < v.n) || others[0];
            const bar = h('div', 'caf-bar');
            bar.appendChild(h('span', '', 'Compare with'));
            const pick = h('select');
            for (const x of others) pick.appendChild(Object.assign(h('option', '', 'Version ' + x.n + ' · ' + dateText(x.time)), { value: x.n }));
            pick.value = before.n;
            bar.appendChild(pick);
            const done = btn('fa-times', 'Close', 'red-ui-button-small');
            done.addEventListener('click', () => drawPane());
            bar.appendChild(done);
            const show = async () => {
                const other = await frames(Number(pick.value));
                const mine = await frames(v.n);
                body.textContent = '';
                if (!other || !mine) return body.appendChild(h('div', 'caf-note', 'This file cannot show here.'));
                const f = frame(mine, v.title);
                f.src += '&compare=' + encodeURIComponent(other.url.split('/v/')[1].split('/')[0]);
                body.appendChild(f);
            };
            pick.addEventListener('change', show);
            head.after(bar);
            show();
        }

        function confirmDelete(item, record) {
            const box = h('div', 'caf-confirm');
            const count = record.versions.filter((x) => !x.deleted && !x.purged).length;
            box.appendChild(h('div', '', 'Delete ' + item.title + '? ' + (count > 1 ? 'All ' + count + ' versions go' : 'The file goes') + ' to the bin for 30 days.'));
            const row = h('div');
            const yes = btn('', 'Delete', 'caf-danger');
            const no = btn('', 'Cancel');
            row.appendChild(yes);
            row.appendChild(no);
            box.firstChild.style.display = 'block';
            box.appendChild(row);
            no.addEventListener('click', () => box.remove());
            yes.addEventListener('click', async () => {
                box.remove();
                const gone = { item, timer: setTimeout(() => { state.pending.delete(item.id); refresh(); }, UNDO_MS) };
                state.pending.set(item.id, gone);
                close();
                try {
                    await request('DELETE', API + '/' + item.id);
                } catch (err) {
                    clearTimeout(gone.timer);
                    state.pending.delete(item.id);
                    RED.notify('The file did not go to the bin.', 'error');
                }
                refresh();
            });
            root.appendChild(box);
        }

        new ResizeObserver(() => { if (root.isConnected) render(); }).observe(root);
        views.add(view);
        render();
        return view;
    }

    // The agent line of the viewer header: the address and "Show agent", or "Agent removed"
    function agentLine(address, nodeId, endFull) {
        const line = h('div', 'caf-line2 caf-address');
        line.appendChild(h('span', '', address + ' · '));
        if (nodeId && RED.nodes.node(nodeId)) {
            const show = h('button', 'caf-showagent', 'Show agent');
            show.type = 'button';
            show.addEventListener('click', () => { endFull(); showAgent(nodeId); });
            line.appendChild(show);
        } else {
            line.appendChild(h('span', '', 'Agent removed'));
        }
        return line;
    }

    // Closes the page, shows the node on the canvas and opens its popup as a click does
    function showAgent(nodeId) {
        const node = RED.nodes.node(nodeId);
        if (!node) return;
        closePage();
        RED.view.reveal(node.id);
        // The popup library adds the popup of a node after a tab change. The click must wait for it.
        const start = Date.now();
        const wait = () => {
            if (document.getElementById('nru_popup.' + node.id + '.group')) window.caOpenPopup(node);
            else if (Date.now() - start < 5000) requestAnimationFrame(wait);
        };
        wait();
    }

    // The Files page: the view of the sidebar in a layer over the editor. It is built at the first open and kept.
    const page = { layer: null, view: null, search: null };

    function pageOpen() {
        return !!page.layer && page.layer.style.display !== 'none';
    }

    // The hash shows the page, so a reload keeps it. replaceState makes no hashchange.
    function setHash() {
        if (!pageOpen()) return;
        const c = page.view.current();
        history.replaceState(null, '', '#files' + (c ? '/' + c.id + '/' + c.n : ''));
    }

    function tabHash() {
        const tab = RED.workspaces.active();
        history.replaceState(null, '', tab ? '#flow/' + tab : location.pathname + location.search);
    }

    function focusable(layer) {
        return [...layer.querySelectorAll('a[href],button,input,select,iframe,[tabindex]')].filter((e) => e.tabIndex >= 0 && !e.disabled && e.getClientRects().length);
    }

    function buildPage() {
        addStyle();
        const layer = h('div', 'caf-page');
        layer.tabIndex = -1;
        layer.setAttribute('role', 'dialog');
        layer.setAttribute('aria-label', 'Files');
        const head = h('div', 'caf-pagehead');
        head.appendChild(h('span', 'caf-pagetitle', 'Files'));
        const close = h('button', 'red-ui-button caf-pageclose', 'Close');
        close.type = 'button';
        close.addEventListener('click', closePage);
        head.appendChild(close);
        layer.appendChild(head);
        const body = h('div', 'caf-pagebody');
        page.view = build({ all: true, onChange: setHash });
        body.appendChild(page.view.root);
        layer.appendChild(body);
        page.search = page.view.root.querySelector('input');
        // One handler for the page. The full-screen viewer ends first: its handler stops Escape before it gets here.
        layer.addEventListener('keydown', (e) => {
            e.stopPropagation();
            if (e.key === 'Escape') return closePage();
            if (e.key !== 'Tab') return;
            const items = focusable(layer);
            const at = items.indexOf(document.activeElement);
            const first = items[0];
            const last = items[items.length - 1];
            if (e.shiftKey ? at <= 0 : at === items.length - 1) {
                e.preventDefault();
                (e.shiftKey ? last : first).focus();
            }
        });
        for (const type of ['keyup', 'keypress']) layer.addEventListener(type, (e) => e.stopPropagation());
        document.body.appendChild(layer);
        page.layer = layer;
    }

    // The editor under the page gets no focus, also with Tab from the viewer frame. A dialog or the clipboard field is outside the editor.
    function editorInert(on) {
        const editor = document.getElementById('red-ui-editor');
        if (!editor) return;
        editor.inert = on;
        // The notices have buttons: they stay outside the inert editor while the page is open.
        const notes = document.getElementById('red-ui-notifications');
        if (!notes) return;
        if (on) {
            if (notes.parentNode !== document.body) page.notesHome = notes.parentNode;
            document.body.appendChild(notes);
        }
        else if (page.notesHome) page.notesHome.appendChild(notes);
    }

    // target: { id, n } of a file to open, or {} for the list
    function openPage(target) {
        if (!page.layer) buildPage();
        page.layer.style.display = '';
        editorInert(true);
        if (target && target.id) page.view.open(target.id, target.n, true);
        else if (!pageOpen() || !page.view.current()) page.view.render();
        setHash();
        page.search.focus();
    }

    function closePage() {
        if (!pageOpen()) return;
        page.layer.style.display = 'none';
        editorInert(false);
        tabHash();
        if (RED.view && RED.view.focus) RED.view.focus();
    }

    // The chat line of a new file: icon, title, "New file" or "Version 3", time. A click opens it in Files.
    function chatLine(e, onOpen) {
        const a = e.artifact;
        const line = h('div', 'caf-line');
        line.tabIndex = 0;
        line.setAttribute('role', 'button');
        line.appendChild(h('i', 'fa ' + iconOf(a.type)));
        line.appendChild(h('span', '', a.title));
        line.appendChild(h('span', 'caf-chip', a.version > 1 ? 'Version ' + a.version : 'New file'));
        line.appendChild(h('span', 'caf-chip', new Date(e.time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })));
        line.addEventListener('click', () => onOpen(a.id, a.version));
        line.addEventListener('keydown', (k) => { if (k.key === 'Enter' || k.key === ' ') { k.preventDefault(); onOpen(a.id, a.version); } });
        return line;
    }

    let filesBody = null;
    let tabOptions = null;
    window.caFiles = { build, chatLine, seenNode, addStyle, openPage, closePage };

    if (window.RED && RED.comms) {
        RED.comms.subscribe(API, (topic, msg) => onRecord(msg));
        load();
        for (const type of ['flows:loaded', 'nodes:add', 'nodes:change']) RED.events.on(type, () => setTimeout(badges, 0));
        for (const type of ['flows:loaded', 'nodes:remove']) RED.events.on(type, () => setTimeout(prune, 0));
        RED.actions.add('claude-agent:show-files-tab', () => { RED.sidebar.show('claude-agent-files'); setTimeout(() => filesBody?.querySelector('input, select, button, [tabindex="0"]')?.focus()); }, { label: 'Show the Files tab' });
        RED.keyboard.add('*', 'ctrl-g f', 'claude-agent:show-files-tab');
        RED.actions.add('claude-agent:show-files-page', () => openPage(), { label: 'Show the Files page' });
        RED.keyboard.add('*', 'ctrl-g shift-f', 'claude-agent:show-files-page');
        RED.menu.addItem('menu-item-view-menu', { id: 'menu-item-claude-agent-files', label: 'Files page', onselect: 'claude-agent:show-files-page', group: 'sidebar-tabs' });
        // Node-RED sets #flow/ at each load and workspace change. The page sets its hash again after that.
        let start = parseHash(startHash);
        RED.events.on('flows:loaded', () => {
            const target = start;
            start = null;
            setTimeout(() => { if (target) openPage(target); else setHash(); }, 0);
        });
        RED.events.on('workspace:change', () => setTimeout(() => { setHash(); if (pageOpen() && !page.layer.contains(document.activeElement)) page.layer.focus(); }, 0));
        // A Tab out of the viewer frame leaves the focus on the body. The keys of the editor must not act then. Full screen gets Escape first.
        document.addEventListener('keydown', (e) => {
            if (!pageOpen() || (e.target !== document.body && e.target !== document.documentElement) || (e.key === 'Escape' && page.layer.querySelector('.caf-full'))) return;
            e.stopPropagation();
            if (e.key === 'Escape') closePage();
            else page.layer.focus();
        }, true);
        window.addEventListener('hashchange', () => {
            const target = parseHash(location.hash);
            if (target) openPage(target);
        });
        if (RED.sidebar && RED.sidebar.addTab) {
            addStyle();
            const body = h('div');
            filesBody = body;
            body.style.cssText = 'position:absolute;inset:0;padding:6px;box-sizing:border-box;display:flex';
            body.appendChild(build({ all: true }).root);
            tabOptions = { id: 'claude-agent-files', name: 'Files', iconClass: 'fa fa-folder-open-o', content: $(body), enableOnEdit: true, action: 'claude-agent:show-files-tab' };
            RED.sidebar.addTab(tabOptions);
            badges();
        }
    }
})();
</script>
