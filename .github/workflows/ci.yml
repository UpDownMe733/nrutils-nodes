name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The tests run Node-RED 5, which needs Node.js 22
          node-version: 22
      - run: npm ci
      - run: npm test
